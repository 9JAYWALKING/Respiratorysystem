  <title>RESPIRATORY SYSTEM</title>
  <script id="site-theme-controller">
    // Apply before first paint. Exam detail frames always stay light without changing the saved preference.
    (() => {
      const key = 'respiratory-site-theme-v1';
      const examPreview = new URLSearchParams(location.search).get('examPreview') === '1';
      const root = document.documentElement;
      const icons = {
        light: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.4A8.8 8.8 0 0 1 10.6 3.5a8.8 8.8 0 1 0 9.9 9.9Z"/></svg>',
        dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      };
      function syncButtons() {
        document.querySelectorAll('[data-theme-toggle]').forEach(button => {
          const dark = root.dataset.theme === 'dark';
          button.innerHTML = icons[dark ? 'dark' : 'light'];
          button.setAttribute('aria-label', dark ? '라이트모드로 전환' : '다크모드로 전환');
          button.setAttribute('aria-pressed', String(dark));
          button.title = dark ? '라이트모드' : '다크모드';
          button.hidden = examPreview;
        });
      }
      function apply(value) {
        root.dataset.theme = !examPreview && value === 'dark' ? 'dark' : 'light';
        syncButtons();
      }
      let initial = 'light';
      try { initial = localStorage.getItem(key) || 'light'; } catch (_) { /* Storage may be unavailable. */ }
      apply(initial);
      window.RespiratoryTheme = { syncButtons };
      document.addEventListener('DOMContentLoaded', syncButtons);
      document.addEventListener('click', event => {
        if (!event.target.closest?.('[data-theme-toggle]') || examPreview) return;
        apply(root.dataset.theme === 'dark' ? 'light' : 'dark');
        try { localStorage.setItem(key, root.dataset.theme); } catch (_) { /* Keep this session usable. */ }
      });
      window.addEventListener('storage', event => {
        if (event.key === key || event.key === null) apply(event.newValue);
      });
    })();
  </script>

    /* Wiki/J 문서 링크를 현재 화면과 나란히 여는 1:1 탐색 패널 */
    body.context-link-open { overflow: hidden; }
    .context-link-split {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #f5ebf2;
    }
    .context-link-source,
    .context-link-target {
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: #fff;
    }
    .context-link-source {
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      border-right: 1px solid #e4cfdd;
      transform: translateZ(0);
    }
    .context-link-target {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
      overflow: hidden;
      background: #fbf8fa;
      box-shadow: -12px 0 30px rgba(78,40,65, .09);
    }
    .context-link-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 62px;
      padding: 10px clamp(14px, 2vw, 24px);
      color: #592d4a;
      background: #f7eff4;
      border-bottom: 1px solid #e5ccdd;
    }
    .context-link-heading { min-width: 0; }
    .context-link-eyebrow { display: block; margin-bottom: 1px; color: #8c5e7d; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .context-link-title { display: block; overflow: hidden; color: #592d4a; font-size: clamp(14px, 1.8vw, 18px); font-weight: 900; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .context-link-controls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .context-link-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 38px;
      padding: 0 11px;
      border: 1px solid #debed3;
      border-radius: 999px;
      color: #6e385c;
      background: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 850;
      cursor: pointer;
    }
    .context-link-control:hover, .context-link-control:focus-visible { background: #fbf8fa; border-color: #c58cb2; outline: 3px solid rgba(197,140,178,.24); outline-offset: 1px; }
    .context-link-control:disabled { opacity: .35; cursor: default; outline: none; }
    .context-link-close { width: 38px; padding: 0; font-size: 24px; line-height: 1; }
    .context-link-expand { width: 38px; padding: 0; font-size: 24px; line-height: 1; }
    .context-link-split.is-expanded { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .context-link-split.is-expanded .context-link-source { display: none; }
    .context-link-split.is-expanded .context-link-target { box-shadow: none; }
    .context-link-body {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding: clamp(12px, 2vw, 24px);
    }
    .context-link-body > .wiki-note,
    .context-link-body > [data-context-question-root] { width: 100%; max-width: none; margin: 0; }
    .context-link-body .wiki-layout { grid-template-columns: minmax(0, 1fr); }

    .context-link-body .wiki-article { min-width: 0; }
    .context-link-empty { display: grid; min-height: 220px; place-items: center; padding: 28px; border: 1px solid #eddce7; border-radius: 18px; color: #6c7680; background: #fff; text-align: center; }

    .context-question-counter small { display: block; font-size: 10px; font-weight: 600; }

<script>
    // Empty subject data; content will be added as respiratory lectures arrive.
    const emptyRenderCourse = {id:0,title:'RESPIRATORY SYSTEM',professor:'',domain:'',discipline:'',section:'',slots:[],isLab:false};

    // Personal study progress is browser-local, keyed by immutable question IDs.
    const questionStudyStatuses = {
      unanswered:{symbol:'', label:'미풀이'}, correct:{symbol:'○', label:'정답'},
      uncertain:{symbol:'△', label:'보류'}, wrong:{symbol:'X', label:'오답'}
    };
    function questionStudyStatus(id) {
      if (String(id).startsWith('jbl-wiki:')) return lectureJblWikiStatus(id);
      const record = wrongAnswers[id];
      if (record && Object.hasOwn(questionStudyStatuses, record.status)) return record.status;
      // Older records stored only wrong answers and subsequent corrections.
      if (record?.pending === true) return 'wrong';
      if (record?.pending === false && !record.manual && record.lastAttemptAt) return 'correct';
      return 'unanswered';
    }
    function questionStudyStatusMarkup(id) {
      const status = questionStudyStatus(id), current = questionStudyStatuses[status];
      const label=String(id).startsWith('jbl-wiki:') ? '학습 상태' : '풀이 상태';
      return `<label class="study-answer-status is-${status}" title="${label}: ${current.label} · 클릭하여 변경"><span data-study-status-symbol aria-hidden="true">${current.symbol}</span><select data-study-status="${escapeHtml(id)}" aria-label="${label}: ${current.label}. 직접 변경">${Object.entries(questionStudyStatuses).map(([value,item]) => `<option value="${value}" ${status === value ? 'selected' : ''}>${item.symbol ? item.symbol + ' ' : ''}${item.label}</option>`).join('')}</select></label>`;
    }
    function refreshQuestionStudyStatus(id) {
      const status = questionStudyStatus(id), current = questionStudyStatuses[status];
      document.querySelectorAll('[data-study-status]').forEach(select => {
        if (select.dataset.studyStatus !== id) return;
        const box = select.closest('.study-answer-status');
        const label=String(id).startsWith('jbl-wiki:') ? '학습 상태' : '풀이 상태';
        select.value = status;
        box.className = `study-answer-status is-${status}`;
        box.title = `${label}: ${current.label} · 클릭하여 변경`;
        select.setAttribute('aria-label', `${label}: ${current.label}. 직접 변경`);
        box.querySelector('[data-study-status-symbol]').textContent = current.symbol;
      });
    }
    function saveQuestionStudyStatus(id, status, manual = false) {
      if (!Object.hasOwn(questionStudyStatuses, status)) return false;
      if (String(id).startsWith('jbl-wiki:')) return saveLectureJblWikiStatus(id,status);
      const old = wrongAnswers[id] || {}, now = Date.now();
      const addWrong = status === 'wrong' && (!manual || questionStudyStatus(id) !== 'wrong');
      const next = {...wrongAnswers, [id]: {...old, status, pending:status === 'wrong', manual,
        statusUpdatedAt:now, wrongCount:(Number(old.wrongCount) || 0) + (addWrong ? 1 : 0),
        lastAttemptAt:manual ? old.lastAttemptAt : now,
        lastWrongAt:addWrong ? now : old.lastWrongAt}};
      if (!writeStudyStorage(wrongAnswerStorageKey, next)) {
        refreshQuestionStudyStatus(id);
        return false;
      }
      wrongAnswers = next;
      refreshQuestionStudyStatus(id);
      return true;
    }
    const wrongQuestionIds = () => jblQuestions.filter(q => questionStudyStatus(q.id) === 'wrong').map(q => q.id);
    function freshQuestionAttempt(state) {
      state.selected = {}; state.answerShown = {}; state.explanationShown = {};
      state.attempts = {}; state.editing = null;
    }
    function markQuestionPeeked(state, question) {
      state.attempts ||= {};
      (state.attempts[question.id] ||= {}).peeked = true;
    }
    function recordQuestionAttempt(state, question, answerIndices) {
      state.attempts ||= {};
      const attempt = state.attempts[question.id] ||= {};
      if (attempt.done || attempt.peeked) return;
      const expected = [...new Set(answerIndices.map(Number))];
      if (!expected.length || expected.some(n => !Number.isInteger(n) || n < 1 || n > question.choices.length)) return;
      const selected = [state.selected[question.id]].flat().map(Number).filter(Number.isFinite);
      if (selected.length !== expected.length) return;
      const correct = expected.every(n => selected.includes(n));
      if (saveQuestionStudyStatus(question.id, correct ? 'correct' : 'wrong')) attempt.done = true;
    }
    function prepareJblStart(wrongOnly = false) {
      const state = standaloneState();
      state.linkedQuestionNumber = null;
      state.filters = {year:'', lectureId:'', professor:'', favoritesOnly:false, wrongOnly};
      // Freeze this review batch so a correct answer cannot shift the next question.
      state.wrongBatch = wrongOnly ? wrongQuestionIds() : null;
      state.index = 0; state.panel = wrongOnly ? 'filter' : null;
      clearJblRandomOrder(state); freshQuestionAttempt(state);
    }
    function quickNavigate(hash) {
      if (contextLinkState.active) closeContextLinkSplit(false);
      if (location.hash !== hash) history.pushState(null, '', hash);
      routeFromHash();
    }
    const quickCategories = [
      ['histology','조직학','기초의학',c=>c.discipline==='조직학'],
      ['physiology','생리학','기초의학',c=>c.discipline==='생리학'],
      ['pharmacology','약리학','기초의학',c=>c.discipline==='약리학'],
      ['pathology','병리학','기초의학',c=>c.discipline==='병리학'],
      ['respiratory','호흡기내과','임상의학',c=>c.discipline==='호흡기내과'],
      ['critical','중환자의학','임상의학',c=>c.discipline==='중환자의학'],
      ['pediatrics','소아청소년과','임상의학',c=>c.discipline==='소아청소년과'],
      ['surgery','흉부외과','임상의학',c=>c.discipline==='흉부외과'],
      ['support','진단·치료 지원분과','임상의학',c=>c.discipline==='진단·치료 지원분과']
    ];
    const respiratoryBookmarkSections = ['진단·검사','기도·알레르기질환','호흡기감염','폐혈관질환','간질성·면역성 폐질환','폐종양','흉막질환'];
    const bookmarkCollectionState = {category:'all',section:''};
    let quickClock = {time:Date.now(), tick:performance.now(), source:'기기 시간'};
    let quickClockPromise = null;
    function koreanDateKey(time) {
      const parts = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(time));
      const part = type => parts.find(p => p.type === type)?.value;
      return `${part('year')}-${part('month')}-${part('day')}`;
    }
    async function refreshQuickClock() {
      if (quickClockPromise) return quickClockPromise;
      quickClockPromise = (async () => {
        if (!/^https?:$/.test(location.protocol)) return;
        const abort = new AbortController();
        const timeout = setTimeout(() => abort.abort(), 4000);
        try {
          const url = new URL(location.href); url.hash = ''; url.searchParams.set('_study_clock', Date.now());
          const response = await fetch(url, {method:'HEAD',cache:'no-store',signal:abort.signal});
          const time = Date.parse(response.headers.get('Date') || '');
          if (response.ok && Number.isFinite(time)) quickClock = {time,tick:performance.now(),source:'서버 시간'};
        } catch (_) { /* Local/offline use keeps a device-clock fallback. */ }
        finally { clearTimeout(timeout); }
      })();
      try { await quickClockPromise; } finally { quickClockPromise = null; }
    }
    function latestStudyCourse(dateKey) {
      return courses.flatMap(course => course.slots.map(slot=>({course,slot})))
        .filter(({slot})=>slot.date <= dateKey && !holidays.has(slot.date))
        .sort((a,b)=>b.slot.date.localeCompare(a.slot.date) || a.slot.time.localeCompare(b.slot.time) || a.course.id-b.course.id)[0] || null;
    }
    function quickClockDate() { return koreanDateKey(quickClock.time + performance.now() - quickClock.tick); }
    function scheduleWeekForDate(dateKey = quickClockDate()) {
      const weeks = Object.keys(weekCalendar).map(Number).filter(week => Number.isFinite(week) && weekCalendar[week]?.월)
        .sort((a,b) => weekCalendar[a].월.localeCompare(weekCalendar[b].월));
      if (!weeks.length) return null;
      // A teaching week lasts through Sunday, even when no classes are scheduled.
      return weeks.filter(week => weekCalendar[week].월 <= dateKey).at(-1) ?? weeks[0];
    }
    function updateQuickReviewLabel() {
      const recent = latestStudyCourse(quickClockDate());
      const label = document.querySelector('[data-quick-review-label]');
      if (label) label.textContent = recent ? `${formatDate(recent.slot.date)}(${recent.slot.day}) · ${contentCourseText(recent.course)}` : '등록된 수업이 없습니다.';
      const button = document.querySelector('[data-quick-review]');
      if (button) button.disabled = !recent;
      const clock = document.querySelector('[data-quick-clock]');
      if (clock) clock.textContent = `${quickClockDate().replaceAll('-', '.')} · ${quickClock.source} · 한국 시간`;
    }
    function quickPreview(name) {
      const shapes = {
        review:'<path d="M54 48h42v48H54zM105 48h42v48h-42zM61 61h27M61 72h23M112 61h27M112 72h23M74 110h52"/>',
        schedule:'<rect x="48" y="39" width="108" height="82" rx="8"/><path d="M48 61h108M73 39v82M100 61v60M127 61v60M48 82h108M48 102h108"/>',
        wrong:'<circle cx="102" cy="80" r="38"/><path d="M91 63l22 34M113 63L91 97"/>',
        bookmarks:'<path d="M76 40h52v80l-26-17-26 17z"/>'
      };
      return '<span class="quick-preview" aria-hidden="true"><svg viewBox="0 0 204 160" style="width:100%;height:100%"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+(shapes[name]||shapes.review)+'</g></svg></span>';
    }

    const diseaseMapCategories = [];
    function mapCategoryButtons(active='',compact=false) {
      return diseaseMapCategories.map(item=>'<button type="button" data-map-open="'+item.id+'"'+
        (item.id===active?' aria-current="page"':'')+(item.courseId?'':' disabled aria-label="'+item.label+' 준비 중" title="준비 중"')+'>'+item.label+
        (item.courseId||compact?'':'<small>준비 중</small>')+'</button>').join('');
    }
    function bindMapCategoryButtons(root) {
      root.querySelectorAll('[data-map-open]').forEach(button=>button.onclick=()=>quickNavigate('#map-'+button.dataset.mapOpen));
    }
    function mapPreviewImage() { return ''; }
    function resolveMapWikiReference(courseId,heading) {
      const course=byId(canonicalContentCourseId(courseId));
      if(!course)return null;
      const matches=wikiSourceHeadingRecords(course).filter(record=>normalizeWikiKey(record.heading)===normalizeWikiKey(heading));
      if(matches.length!==1)return null;
      return {courseId:course.id,heading:matches[0].heading,slug:matches[0].slug};
    }

    function renderDiseaseMap() {
      document.querySelector('#disease-map-root').innerHTML='<header class="map-page-heading"><h2>모든 병 주행</h2></header><div class="personal-note-empty">등록된 MAP이 없습니다.</div>';
    }
    function renderQuickStart() {
      const root = document.querySelector('#quick-start-root');
      const homeIcons = {
        calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M7 14h3m4 0h3M7 17h3"/>',
        questions:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
        review:'<path d="M12 5v15M12 5C8 3 5 3 2 4v15c3-1 6-1 10 1 4-2 7-2 10-1V4c-3-1-6-1-10 1Z"/>',
        favorites:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',
        wrong:'<path d="M4 10a8 8 0 1 1 1 8M4 4v6h6m0 0 5 5m0-5-5 5"/>',
        exam:'<circle cx="12" cy="14" r="8"/><path d="M9 2h6m-3 0v4m0 4v5l3 2M18 6l2-2"/>',
        mock:'<rect x="5" y="5" width="15" height="16" rx="2"/><path d="M9 5V3h7v2M9 10h7m-7 4h7m-7 4h4"/>',
        notes:'<path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9M10 14l1-4 8-8 3 3-8 8-4 1Z"/>',
        save:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>'
      };
      root.innerHTML = `<header class="quick-heading"><h2>빠른 시작</h2><div class="quick-clock-actions"><span data-quick-clock></span><button class="information-button" type="button" data-information-open aria-label="업데이트 현황">i</button></div></header>
        <div class="study-home-grid study-app-grid">
          <div class="study-home-primary"><article class="study-home-schedule"><button class="study-app" type="button" data-quick-schedule><span class="study-app-icon app-calendar" aria-hidden="true">🗓️</span><h3>시간표</h3></button></article><article class="study-home-schedule"><button class="study-app" type="button" data-quick-route="#jbl"><span class="study-app-icon app-questions" aria-hidden="true">📚</span><h3>족보만 보기</h3></button></article></div>
          <button class="study-app" type="button" data-quick-review><span class="study-app-icon app-review" aria-hidden="true">📖</span><h3>최근 수업 복습</h3><span class="study-app-caption" data-quick-review-label></span></button>
          <button class="study-app" type="button" data-quick-bookmarks><span class="study-app-icon app-favorites" aria-hidden="true">⭐</span><h3>즐겨찾기</h3><span class="study-app-caption">문단 ${wikiBookmarks.length} · 문항 ${jblFavorites.size}</span></button>
          <button class="study-app" type="button" data-quick-wrong><span class="study-app-icon app-wrong" aria-hidden="true">✏️</span><h3>오답 복습</h3><span class="study-app-caption">${wrongQuestionIds().length}문항</span></button>
          <button class="study-app" type="button" disabled><span class="study-app-icon app-exam" aria-hidden="true">⏱️</span><h3>실전 훈련</h3><span class="study-app-caption">준비 중</span></button>
          <button class="study-app" type="button" disabled><span class="study-app-icon app-mock" aria-hidden="true">📝</span><h3>실전 모의고사</h3><span class="study-app-caption">준비 중</span></button>
        </div>
        <nav class="study-home-tools" aria-label="개인 도구"><button class="study-app" type="button" data-quick-route="#personal-notes"><span class="study-app-icon app-notes" aria-hidden="true">📒</span><span class="study-app-name">나만의 정리</span></button><button class="study-app" type="button" data-quick-save aria-label="현재 사이트 파일 저장"><span class="study-app-icon app-save" aria-hidden="true">💾</span><span class="study-app-name">파일 저장</span></button></nav>`;
      Object.entries(homeIcons).forEach(([name,paths])=>{
        const icon=root.querySelector('.app-'+name);
        if(icon)icon.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+paths+'</svg>';
      });
      updateQuickReviewLabel(); refreshQuickClock().then(updateQuickReviewLabel);
      root.querySelector('[data-quick-review]').onclick=()=>{const recent=latestStudyCourse(quickClockDate());if(recent)quickNavigate('#lecture-'+recent.course.id);};
      root.querySelector('[data-quick-schedule]').onclick=()=>quickNavigate('#schedule');
      root.querySelector('[data-quick-wrong]').onclick=()=>quickNavigate('#jbl-wrong');

      return Boolean(resolveWikiSourceSection(course, sectionName));
    }

    function wikiLinkMarkup(rawTarget, rawDisplay, currentCourse, stronglyEmphasized = false) {
      const target = String(rawTarget || '').trim();
      const linkClass = stronglyEmphasized ? 'wiki-link wiki-link-strong' : 'wiki-link';
      const missingClass = stronglyEmphasized ? 'wiki-link-missing wiki-link-strong' : 'wiki-link-missing';
      if (/^https?:\/\//i.test(target)) {
        try {
          const url = new URL(target);
          if (['https:', 'http:'].includes(url.protocol)) return `<a class="${linkClass}" href="${escapeHtml(url.href)}" target="_blank" rel="noopener noreferrer">${wikiEmphasisMarkup(String(rawDisplay || '').trim() || target)}</a>`;
        } catch (_) { /* Invalid external URLs fall through to the missing-link renderer. */ }
      }
      const separator = target.indexOf('#');
      const documentName = separator >= 0 ? target.slice(0, separator).trim() : target;
      let sectionName = separator >= 0 ? target.slice(separator + 1).trim() : '';
      const display = String(rawDisplay || '').trim() || (documentName || `#${sectionName}`);
      let targetCourse = findWikiCourse(documentName, currentCourse);
      if (!documentName && sectionName && !wikiSourceHasSection(currentCourse, sectionName)) {
        const courseNamedLikeSection = findWikiCourse(sectionName, null);
        if (courseNamedLikeSection && courseNamedLikeSection.id !== currentCourse.id) {
          targetCourse = courseNamedLikeSection;
          sectionName = '';
        }
      }
      if (!targetCourse) return `<span class="${missingClass}" title="연결할 문서를 찾을 수 없습니다.">${wikiEmphasisMarkup(display)}</span>`;
      const canonicalCourse = byId(canonicalContentCourseId(targetCourse.id)) || targetCourse;
      const targetSection = sectionName ? resolveWikiSourceSection(canonicalCourse, sectionName) : null;
      if (sectionName && !targetSection) return `<span class="${missingClass}" title="연결할 문단을 정확히 찾을 수 없습니다.">${wikiEmphasisMarkup(display)}</span>`;
      return `<a class="${linkClass}" href="#lecture-${canonicalCourse.id}" data-wiki-course="${canonicalCourse.id}" data-wiki-section="${escapeHtml(targetSection?.slug || '')}">${wikiEmphasisMarkup(display)}</a>`;
    }

    function wikiFootnotePreviewText(value) {
      const text = String(value || '')
        .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/\{\{(\d+)\}\}/g, '$1번 문항')
        .replace(/'''|''|""|~~~|~~/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > 260 ? `${text.slice(0, 257)}…` : text;
    }

    function renderWikiInline(value, course, footnoteState, allowFootnotes = true, strongContext = false) {
      const source = String(value || '');
      const tokenPattern = /'''([\s\S]*?)'''|""([\s\S]*?)""|\[\*((?:\[\[[^\]]+\]\]|[^\]])+)\]|\[\[([^\]]+)\]\]|\{\{(\d+)\}\}|(?<!~)~~(?!~)([\s\S]*?)~~~(?!~)/g;
      let output = '';
      let cursor = 0;
      for (const match of source.matchAll(tokenPattern)) {
        output += wikiEmphasisMarkup(source.slice(cursor, match.index));
        if (match[1] != null) {
          output += `<strong class="wiki-strong-group">${renderWikiInline(match[1], course, footnoteState, allowFootnotes, true)}</strong>`;
        } else if (match[2] != null) {
          output += `<strong class="wiki-strong-purple">${renderWikiInline(match[2], course, footnoteState, allowFootnotes, true)}</strong>`;
        } else if (match[3] != null && allowFootnotes) {
          const rawBody = match[3];
          const anonymous = /^\s/.test(rawBody);
          const trimmed = rawBody.trim();
          let name = '';
          let content = trimmed;
          if (!anonymous) {
            const namedMatch = trimmed.match(/^(\S+)\s+([\s\S]+)$/);
            if (namedMatch) {
              [, name, content] = namedMatch;
            } else {
              name = trimmed;
              const existing = footnoteState.named.get(name);
              content = existing ? existing.content : '각주 내용 없음';
            }
          }
          let footnote = name ? footnoteState.named.get(name) : null;
          if (!footnote) {
            footnote = { number:footnoteState.items.length + 1, name, content, references:0 };
            footnoteState.items.push(footnote);
            if (name) footnoteState.named.set(name, footnote);
          }
          footnote.references += 1;
          const referenceId = `wiki-fnref-${course.id}-${footnote.number}-${footnote.references}`;
          output += `<sup><a id="${referenceId}" class="wiki-footnote-ref" href="#wiki-fn-${course.id}-${footnote.number}" data-wiki-footnote="${footnote.number}" data-wiki-footnote-preview="${escapeHtml(wikiFootnotePreviewText(footnote.content))}">[${footnote.number}]</a></sup>`;
        } else if (match[3] != null) {
          output += wikiEmphasisMarkup(match[0]);
        } else if (match[4] != null) {
          const parts = match[4].split('|');
          output += wikiLinkMarkup(parts.shift(), parts.join('|'), course, strongContext);
        } else if (match[6] != null) {
          output += `<span class="wiki-muted">${renderWikiInline(match[6], course, footnoteState, allowFootnotes, strongContext)}</span>`;
        } else {
          const globalNumber = Number(match[5]);
          const linkedQuestion = jblQuestions.find(question => question.globalNumber === globalNumber);
          output += linkedQuestion
            ? `<a class="jbl-question-link" href="#jbl-q-${globalNumber}" data-jbl-question-link="${globalNumber}">${globalNumber}번 문항</a>`
            : `<span class="jbl-question-link-missing" title="연결할 문항을 찾을 수 없습니다.">${globalNumber}번 문항</span>`;
        }
        cursor = match.index + match[0].length;
      }
      output += wikiEmphasisMarkup(source.slice(cursor));
      return output;
    }

    function renderWikiFigure(line, course, footnoteState) {
      const match = line.match(/^\[\[파일:([^|\]]+)(?:\|([^\]]*))?\]\]$/);
      if (!match) return '';
      const source = match[1].trim().replace(/^\.\//, '');
      const captionParts = (match[2] || '강의록 이미지').split('|');
      const originalOption = captionParts.length > 1 && /^원본:/.test(captionParts.at(-1)) ? captionParts.pop().slice(3).trim().replace(/^\.\//, '') : '';
      const caption = captionParts.join('|').trim();
      if (!source || /^(?:javascript|data):/i.test(source)) return '<div class="wiki-render-warning">허용되지 않는 이미지 경로입니다.</div>';
      const safeOriginal = originalOption && !/^(?:javascript|data):/i.test(originalOption) ? originalOption : '';
      const controls = safeOriginal ? `<div class="wiki-image-controls"><button class="wiki-image-toggle" type="button" data-wiki-image-toggle data-marked-src="./${escapeHtml(source)}" data-original-src="./${escapeHtml(safeOriginal)}" aria-pressed="true" aria-label="원본 필기 표시 숨기기">표시 숨기기</button></div>` : '';
      return `<figure class="wiki-figure">${controls}<img data-note-image src="./${escapeHtml(source)}" alt="${escapeHtml(caption)}" /><figcaption>${renderWikiInline(caption, course, footnoteState)}</figcaption></figure>`;
    }

    function renderWikiDocument(source, course) {
      const lines = expandWikiGrayBlocks(String(source || '').replace(/\r\n?/g, '\n')).split('\n');
      const footnotes = { items:[], named:new Map() };
      let title = titleText(course);
      let summary = '';
      const tags = [];
      const contentLines = [];
      lines.forEach(line => {
        const titleMatch = line.match(/^=\s+(.+?)\s+=$/);
        if (titleMatch) title = titleMatch[1];
        else if (line.startsWith('@summary ')) summary = line.slice(9).trim();
        else if (line.startsWith('@tag ')) tags.push(line.slice(5).trim());
        else contentLines.push(line);
      });

      const allHeadingRecords = wikiHeadingRecordsFromLines(contentLines);
      const headingByLine = new Map(allHeadingRecords.map(record => [record.lineIndex, record]));
      const headingRecords = allHeadingRecords.filter(record => record.level === 2);

      let sectionCursor = 0;
      let sectionOpen = false;
      let detailOpen = false;
      let listType = '';
      let paragraph = [];
      const body = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        body.push(`<p>${renderWikiInline(paragraph.join(' '), course, footnotes)}</p>`);
        paragraph = [];
      };
      const closeList = () => {
        if (!listType) return;
        body.push(`</${listType}>`);
        listType = '';
      };
      const openList = type => {
        if (listType === type) return;
        closeList();
        body.push(`<${type}>`);
        listType = type;
      };
      const flushText = () => { flushParagraph(); closeList(); };
      const closeDetail = () => { if (detailOpen) { body.push('</div>'); detailOpen = false; } };

      for (let index = 0; index < contentLines.length; index += 1) {
        const line = contentLines[index].trim();
        if (!line) { flushText(); continue; }
        if (parseWikiTableRow(line)) {
          flushText();
          const rows = [];
          while (index < contentLines.length && parseWikiTableRow(contentLines[index])) rows.push(contentLines[index++]);
          index -= 1;
          body.push(renderWikiTable(rows, course, footnotes));
          continue;
        }
        const headingMatch = parseWikiHeading(line);
        const imageMatch = line.match(/^\[\[파일:/);
        if (headingMatch?.level === 2) {
          flushText();
          closeDetail();
          if (sectionOpen) body.push('</div></section>');
          const record = headingByLine.get(index) || { heading:headingMatch.heading, slug:`section-${sectionCursor + 1}`, number:`s-${sectionCursor + 1}` };
          sectionCursor += 1;
          const contentId = `wiki-${course.id}-${record.slug}-content`;
          body.push(`<section id="wiki-${course.id}-${record.slug}" class="wiki-section" data-wiki-section="${record.slug}" data-wiki-heading="${escapeHtml(record.heading)}" data-wiki-number="${record.number}"><div class="wiki-section-head"><h4>${renderWikiInline(headingMatch.displayHeading || headingMatch.heading, course, footnotes)}</h4><div class="wiki-section-actions"><button class="wiki-section-action" type="button" data-wiki-section-toggle aria-expanded="true" aria-controls="${contentId}">접기</button><button class="wiki-section-action" type="button" data-wiki-section-edit="${sectionCursor - 1}" aria-label="${escapeHtml(record.heading)} 문단 편집">편집</button></div></div><div id="${contentId}" class="wiki-section-content">`);
          sectionOpen = true;
        } else if (headingMatch && headingMatch.level > 2) {
          flushText();
          closeDetail();
          if (headingMatch.level === 4) { body.push('<div class="wiki-subsubsection">'); detailOpen = true; }
          const tag = headingMatch.level === 4 ? 'h6' : 'h5';
          const record = headingByLine.get(index) || { heading:headingMatch.heading, slug:normalizeWikiKey(headingMatch.heading), number:'' };
          body.push(`<${tag} id="wiki-${course.id}-${record.slug}" data-wiki-level="${headingMatch.level}" data-wiki-section="${record.slug}" data-wiki-heading="${escapeHtml(record.heading)}" data-wiki-number="${record.number}">${renderWikiInline(record.displayHeading || record.heading, course, footnotes)}</${tag}>`);
        } else if (line.startsWith('* ')) {
          flushParagraph();
          openList('ul');
          body.push(`<li>${renderWikiInline(line.slice(2), course, footnotes)}</li>`);
        } else if (line.startsWith('# ')) {
          flushParagraph();
          openList('ol');
          body.push(`<li>${renderWikiInline(line.slice(2), course, footnotes)}</li>`);
        } else if (line.startsWith('> ')) {
          flushText();
          body.push(`<div class="wiki-callout">${renderWikiInline(line.slice(2), course, footnotes)}</div>`);
        } else if (imageMatch) {
          flushText();
          const figures = [];
          while (index < contentLines.length && contentLines[index].trim().match(/^\[\[파일:/)) {
            figures.push(renderWikiFigure(contentLines[index].trim(), course, footnotes));
            index += 1;
          }
          index -= 1;
          body.push(`<div class="wiki-grid ${figures.length === 1 ? 'single' : ''}">${figures.join('')}</div>`);
        } else {
          paragraph.push(line);
        }
      }
      flushText();
      closeDetail();
      if (sectionOpen) body.push('</div></section>');

      if (footnotes.items.length) {
        body.push(`<section class="wiki-footnotes"><h4>각주</h4><ol>${footnotes.items.map(item => `<li id="wiki-fn-${course.id}-${item.number}" class="wiki-footnote-item" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="1" tabindex="0" role="link" aria-label="각주 ${item.number}의 본문 위치로 돌아가기">${renderWikiInline(item.content, course, footnotes, false)}<span class="wiki-footnote-backs">${Array.from({ length:item.references }, (_, index) => `<a class="wiki-footnote-back" href="#wiki-fnref-${course.id}-${item.number}-${index + 1}" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="${index + 1}" aria-label="본문의 각주 ${item.number} ${index + 1}번째 위치로 돌아가기">↩${item.references > 1 ? index + 1 : ''}</a>`).join('')}</span></li>`).join('')}</ol></section>`);
      }

      const toc = headingRecords.map((record, index) => `<button class="wiki-toc-link" type="button" data-wiki-target="${record.slug}">${index + 1}. ${renderWikiInline(record.displayHeading || record.heading, course, footnotes, false)}</button>`).join('');
      const tagMarkup = tags.map(tag => `<span class="wiki-stat">${escapeHtml(tag)}</span>`).join('');
      return `<article class="wiki-note"><header class="wiki-hero"><div class="wiki-hero-title-row"><div class="wiki-hero-title"><h3>${renderWikiInline(title, course, footnotes, false)}</h3></div></div>${summary ? `<p>${renderWikiInline(summary, course, footnotes, false)}</p>` : ''}<div class="wiki-stat-row">${tagMarkup}</div></header><div class="wiki-layout"><aside class="wiki-toc" aria-label="정리본 목차"><strong>목차</strong>${toc}</aside><div class="wiki-article">${body.join('')}</div></div></article>`;
    }

    function parseWikiTableRow(line) {
      const source = String(line || '').trim();
      if (!source.startsWith('||') || !source.endsWith('||') || source.length < 4) return null;
      // Single pipes in [[target|label]] remain inside their cell.
      return source.slice(2, -2).split('||').map(cell => cell.trim());
    }

    function renderWikiTable(rows, course, footnotes) {
      const cells = rows.map(parseWikiTableRow).filter(Boolean);
      if (!cells.length) return '';
      const width = Math.max(...cells.map(row => row.length));
      const hasHeader = cells[0].every(cell => cell.startsWith('='));
      const rowHtml = (row, header) => '<tr>' + Array.from({ length:width }, (_, i) => {
        const text = row[i] || '';
        const tag = header ? 'th' : 'td';
        return `<${tag}${header ? ' scope="col"' : ''}>${renderWikiInline(header ? text.replace(/^=\s*/, '') : text, course, footnotes)}</${tag}>`;
      }).join('') + '</tr>';
      const head = hasHeader ? `<thead>${rowHtml(cells.shift(), true)}</thead>` : '';
      return `<div class="wiki-table-wrap" role="region" aria-label="문서 표" tabindex="0"><table class="wiki-table">${head}<tbody>${cells.map(row => rowHtml(row, false)).join('')}</tbody></table></div>`;
    }

    function renderJblWikiFragment(value, question, fragmentName = 'content') {
      const course = byId(question.lectureIds?.[0]) || emptyRenderCourse;
      const footnotes = { items:[], named:new Map() };
      const lines = expandWikiGrayBlocks(String(value || '').replace(/\r\n?/g, '\n')).split('\n');
      const output = [];
      let paragraph = [];
      let list = [];
      let listType = '';
      const flushParagraph = () => {
        if (!paragraph.length) return;
        output.push(`<p>${paragraph.map(line => renderWikiInline(line, course, footnotes)).join('<br>')}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!list.length) return;
        output.push(`<${listType || 'ul'}>${list.map(item => `<li>${renderWikiInline(item, course, footnotes)}</li>`).join('')}</${listType || 'ul'}>`);
        list = [];
        listType = '';
      };
      const flushText = () => { flushParagraph(); flushList(); };
      let detailOpen = false;
      const closeDetail = () => { if (detailOpen) { output.push('</div>'); detailOpen = false; } };

      for (let lineIndex = 0; lineIndex < lines.length; lineIndex += 1) {
        const rawLine = lines[lineIndex];
        const line = rawLine.trim();
        if (!line) { flushText(); continue; }
        if (parseWikiTableRow(line)) {
          flushText();
          const rows = [];
          while (lineIndex < lines.length && parseWikiTableRow(lines[lineIndex])) rows.push(lines[lineIndex++]);
          lineIndex -= 1;
          output.push(renderWikiTable(rows, course, footnotes));
          continue;
        }
        if (/^\[\[파일:/.test(line)) {
          const figures = [];
          while (lineIndex < lines.length && /^\[\[파일:/.test(lines[lineIndex].trim())) {
            const figure = renderWikiFigure(lines[lineIndex].trim(), course, footnotes);
            if (!figure) break;
            figures.push(figure); lineIndex += 1;
          }
          if (figures.length) { lineIndex -= 1; flushText(); output.push(`<div class="wiki-grid ${figures.length === 1 ? 'single' : ''}">${figures.join('')}</div>`); continue; }
        }
        const heading = parseWikiHeading(line);
        if (heading) {
          flushText(); closeDetail();
          if (heading.level === 4) { output.push('<div class="wiki-subsubsection">'); detailOpen = true; }
          const tag = heading.level === 2 ? 'h3' : heading.level === 3 ? 'h4' : 'h5';
          output.push('<' + tag + ' data-wiki-level="' + heading.level + '">' + renderWikiInline(heading.displayHeading, course, footnotes, false) + '</' + tag + '>');
          continue;
        }
        if (line.startsWith('* ')) {
          flushParagraph();
          if (listType && listType !== 'ul') flushList();
          listType = 'ul';
          list.push(line.slice(2));
          continue;
        }
        if (line.startsWith('# ')) {
          flushParagraph();
          if (listType && listType !== 'ol') flushList();
          listType = 'ol';
          list.push(line.slice(2));
          continue;
        }
        if (line.startsWith('> ')) { flushText(); output.push(`<blockquote>${renderWikiInline(line.slice(2), course, footnotes)}</blockquote>`); continue; }
        flushList();
        paragraph.push(line);
      }
      flushText();
      closeDetail();

      if (footnotes.items.length) {
        output.push(`<section class="wiki-footnotes"><h4>각주</h4><ol>${footnotes.items.map(item => `<li id="wiki-fn-${course.id}-${item.number}" class="wiki-footnote-item" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="1" tabindex="0" role="link" aria-label="각주 ${item.number}의 본문 위치로 돌아가기">${renderWikiInline(item.content, course, footnotes, false)}<span class="wiki-footnote-backs">${Array.from({ length:item.references }, (_, index) => `<a class="wiki-footnote-back" href="#wiki-fnref-${course.id}-${item.number}-${index + 1}" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="${index + 1}" aria-label="본문의 각주 ${item.number} ${index + 1}번째 위치로 돌아가기">↩${item.references > 1 ? index + 1 : ''}</a>`).join('')}</span></li>`).join('')}</ol></section>`);
      }
      const fragmentPrefix = `wiki-j-${question.globalNumber}-${fragmentName}`;
      const fragmentHtml = output.join('')
        .replaceAll(`wiki-fnref-${course.id}-`, `${fragmentPrefix}-fnref-`)
        .replaceAll(`wiki-fn-${course.id}-`, `${fragmentPrefix}-fn-`);
      return `<div class="jbl-wiki-text">${fragmentHtml}</div>`;
    }

    function findWikiSectionTarget(container, rawSection) {
      const requested = String(rawSection || '').replace(/^#/, '').trim();
      if (!requested) return container.querySelector('.wiki-note');
      // Link controls carry the destination slug too; only document headings are destinations.
      const candidates = [...container.querySelectorAll('[data-wiki-section], [data-wiki-number]')]
        .filter(element => element.matches('section, h1, h2, h3, h4, h5, h6'));
      const exact = candidates.find(element => element.dataset.wikiSection === requested || element.dataset.wikiNumber === requested);
      if (exact) return exact;
      const ranked = candidates.map((element, index) => {
        let score = 0;
        if (element.dataset.wikiNumber === requested) score = 120;
        score = Math.max(score, wikiSectionTextScore(element.dataset.wikiSection, requested));
        score = Math.max(score, wikiSectionTextScore(element.dataset.wikiHeading, requested));
        return { element, score, index };
      }).filter(item => item.score > 0);
      ranked.sort((a, b) => b.score - a.score || a.index - b.index);
      if (ranked[1]?.score === ranked[0]?.score) return null;
      return ranked[0]?.element || null;
    }

    function scrollWikiElementIntoView(target, { block = 'start', flash = false, behavior = 'smooth' } = {}) {
      if (!target) return false;
      const navigationToken = ++wikiNavigationToken;
      const parentSection = target.classList?.contains('wiki-section') ? target : target.closest?.('.wiki-section');
      if (parentSection?.classList.contains('is-collapsed')) setWikiSectionExpanded(parentSection, true);
      const align = behavior => {
        // A lazy image from an earlier navigation must not move a new split/view.
        if (navigationToken !== wikiNavigationToken || !target.isConnected) return;
        target.scrollIntoView({ behavior, block, inline:'nearest' });
      };
      align(behavior);
      const imageScope = target.closest?.('.wiki-note, .jbl-card') || target.parentElement || document;
      const pendingImages = [...imageScope.querySelectorAll('img')].filter(image =>
        !image.complete && Boolean(image.compareDocumentPosition(target) & Node.DOCUMENT_POSITION_FOLLOWING)
      );
      if (pendingImages.length) {
        Promise.all(pendingImages.map(image => new Promise(resolve => {
          image.addEventListener('load', resolve, { once:true });
          image.addEventListener('error', resolve, { once:true });
        }))).then(() => requestAnimationFrame(() => align('auto')));
      }
      if (flash) {
        target.classList.remove('wiki-footnote-flash');
        requestAnimationFrame(() => target.classList.add('wiki-footnote-flash'));
        window.setTimeout(() => target.classList.remove('wiki-footnote-flash'), 1200);
      }
      return true;
    }

    function scrollToWikiSection(container, rawSection, behavior = 'smooth') {
      const target = findWikiSectionTarget(container, rawSection);
      const moved = scrollWikiElementIntoView(target, { block:'start', behavior });
      if (moved) updateWikiToggleAll(container);
      return moved;
    }

    let wikiNavigationToken = 0;
    function queueWikiSectionScroll(containerOrFactory, rawSection) {
      const token = ++wikiNavigationToken;
      const attempt = remaining => requestAnimationFrame(() => requestAnimationFrame(() => {
        if (token !== wikiNavigationToken) return;
        const container = typeof containerOrFactory === 'function' ? containerOrFactory() : containerOrFactory;
        if (container && scrollToWikiSection(container, rawSection, 'auto')) return;
        if (remaining > 0) window.setTimeout(() => attempt(remaining - 1), 50);
      }));
      attempt(8);
    }

    function setWikiSectionExpanded(section, expanded) {
      if (!section) return;
      section.classList.toggle('is-collapsed', !expanded);
      const button = section.querySelector(':scope > .wiki-section-head [data-wiki-section-toggle]');
      if (!button) return;
      button.setAttribute('aria-expanded', String(expanded));
      button.textContent = expanded ? '접기' : '펼치기';
    }

    function updateWikiToggleAll(container) {
      const button = container?.querySelector('[data-wiki-toggle-all]');
      const sections = [...(container?.querySelectorAll('.wiki-section') || [])];
      if (!button || !sections.length) return;
      const allCollapsed = sections.every(section => section.classList.contains('is-collapsed'));
      button.textContent = allCollapsed ? '모두 펼치기' : '모두 접기';
      button.setAttribute('aria-pressed', String(allCollapsed));
    }

    function currentStudyWiki() {
      if (contextLinkState.active) return document.querySelector('.context-link-body .wiki-note');
      return [...document.querySelectorAll('main > .view:not([hidden]) .wiki-note')]
        .find(note => !note.closest('[hidden], [aria-hidden="true"]')) || null;
    }

    function studyWikiTools() {
      const note = currentStudyWiki();
      const sections = [...(note?.querySelectorAll('.wiki-section') || [])];
      const courseId = Number(note?.dataset.wikiDocumentCourse);
      return {

    // Edit a heading and its descendants up to the next peer/ancestor heading.
    // Offsets refer to the unmodified source, so Wiki markup and blank lines survive.
    function wikiEditableSections(source) {
      const raw = String(source || '');
      const lines = raw.split('\n');
      let offset = 0;
      const offsets = lines.map(line => { const start = offset; offset += line.length + 1; return start; });
      const records = wikiHeadingRecordsFromLines(lines);
      return records.map((record, index) => {
        const next = records.slice(index + 1).find(item => item.level <= record.level);
        const start = offsets[record.lineIndex];
        const end = next ? offsets[next.lineIndex] : raw.length;
        const chunk = raw.slice(start, end);
        const trailing = chunk.match(/(?:\r?\n\s*)*$/)?.[0] || '';
        const editEnd = end - trailing.length;
        return { ...record, start, end:editEnd, source:raw.slice(start, editEnd) };
      });
    }

    function openWikiSectionEditor(course, selector, container) {
      const baseline = String(lectureNoteSources[course.id] || '');
      const sections = wikiEditableSections(baseline);
      const section = typeof selector === 'number'
        ? sections.filter(item => item.level === 2)[selector]
        : sections.find(item => item.slug === selector);
      if (!section) return;
      document.querySelector('.wiki-section-editor-overlay')?.remove();
      const overlay = document.createElement('div');
      overlay.className = 'wiki-section-editor-overlay';
      const marks = '='.repeat(section.level);
      overlay.innerHTML = `<section class="wiki-section-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="wiki-section-editor-title"><div class="wiki-section-editor-head"><div><h3 id="wiki-section-editor-title">문단 편집</h3><p>${escapeHtml(section.heading)} · 제목과 아래 내용을 편집합니다.</p></div><button class="wiki-section-action" type="button" data-wiki-section-editor-close aria-label="문단 편집 닫기">닫기</button></div><div class="wiki-section-editor-body"><textarea class="wiki-source-editor" data-wiki-section-source spellcheck="false">${escapeHtml(section.source)}</textarea>${wikiSyntaxHelpMarkup()}<div class="wiki-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-wiki-section-editor-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-wiki-section-editor-save>저장하기</button></div></div></section>`;
      const opener = document.activeElement;
      document.body.append(overlay);
      const textarea = overlay.querySelector('[data-wiki-section-source]');
      const close = () => {
        document.removeEventListener('keydown', keys, true);
        overlay.remove();
        if (opener?.isConnected) opener.focus({ preventScroll:true });
        window.PATHOLOGY_MAP?.refreshLayout?.();
      };
      const keys = event => {
        if (event.key === 'Escape') { event.preventDefault(); event.stopImmediatePropagation(); close(); }
        if (event.key === 'Tab') {
          const controls = [...overlay.querySelectorAll('button, textarea, summary, a[href]')].filter(el => el.getClientRects().length);
          const first = controls[0], last = controls.at(-1);
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      };
      document.addEventListener('keydown', keys, true);
      overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
      overlay.querySelector('[data-wiki-section-editor-close]').addEventListener('click', close);
      overlay.querySelector('[data-wiki-section-editor-cancel]').addEventListener('click', close);
      textarea.addEventListener('input', () => textarea.setCustomValidity(''));
      overlay.querySelector('[data-wiki-section-editor-save]').addEventListener('click', () => {
        const updated = textarea.value;
        const first = parseWikiHeading(expandWikiGrayBlocks(updated).split(/\r?\n/).find(line => line.trim()) || '');
        if (!first || first.level !== section.level) {
          textarea.setCustomValidity(`첫 줄에 ${marks} 문단 제목 ${marks} 형식을 유지하세요.`);
          textarea.reportValidity(); return;
        }
        if (String(lectureNoteSources[course.id]) !== baseline) {
          textarea.setCustomValidity('편집 중 문서가 변경되었습니다. 작성 내용을 복사한 뒤 문단을 다시 열어 주세요.');
          textarea.reportValidity(); return;
        }
        const replacement = baseline.includes('\r\n') ? updated.replace(/\r?\n/g, '\r\n') : updated;
        const source = baseline.slice(0, section.start) + replacement + baseline.slice(section.end);
        // A no-op save should not change the file, including line endings.
        lectureNoteSources[course.id] = source;
        window.LECTURE_NOTE_SOURCES = lectureNoteSources;
        if (source !== baseline) jblHasUnsavedChanges = true;
        close();
        refreshEditedWiki(course, first.heading);
        if (container?.isConnected) queueWikiSectionScroll(container, first.heading);
      });
      textarea.focus();
    }


    let activeWikiFootnotePreviewReference = null;
    function ensureWikiFootnotePreviewBox() {
      let preview = document.querySelector('[data-wiki-footnote-preview-box]');
      if (preview) return preview;
      preview = document.createElement('div');
      preview.className = 'wiki-footnote-preview-box';
      preview.dataset.wikiFootnotePreviewBox = '';
      preview.setAttribute('role', 'tooltip');
      preview.innerHTML = '<span data-wiki-footnote-preview-text></span><span class="wiki-footnote-preview-arrow" aria-hidden="true"></span>';
      document.body.appendChild(preview);
      const refresh = () => {
        if (activeWikiFootnotePreviewReference?.isConnected) positionWikiFootnotePreview(activeWikiFootnotePreviewReference);
        else hideWikiFootnotePreview();
      };
      window.addEventListener('resize', refresh, { passive:true });
      window.visualViewport?.addEventListener('resize', refresh, { passive:true });
      window.visualViewport?.addEventListener('scroll', refresh, { passive:true });
      document.addEventListener('scroll', refresh, { passive:true, capture:true });
      return preview;
    }

    function positionWikiFootnotePreview(reference) {
      const preview = ensureWikiFootnotePreviewBox();
      const text = reference?.dataset.wikiFootnotePreview?.trim();
      if (!reference?.isConnected || !text) { hideWikiFootnotePreview(); return; }
      const previewHost = reference.closest('dialog') || document.body;
      if (preview.parentElement !== previewHost) previewHost.append(preview);
      preview.querySelector('[data-wiki-footnote-preview-text]').textContent = text;
      preview.classList.add('is-visible');
      preview.style.left = '0px';
      preview.style.top = '0px';
      preview.style.visibility = 'hidden';
      const referenceRect = reference.getBoundingClientRect();
      const previewRect = preview.getBoundingClientRect();
      const viewport = window.visualViewport;
      const viewportLeft = viewport?.offsetLeft || 0;
      const viewportTop = viewport?.offsetTop || 0;
      const viewportRight = viewportLeft + (viewport?.width || window.innerWidth);
      const viewportBottom = viewportTop + (viewport?.height || window.innerHeight);
      const margin = 12;
      const gap = 10;
      const center = referenceRect.left + referenceRect.width / 2;
      const aboveTop = referenceRect.top - previewRect.height - gap;
      const belowTop = referenceRect.bottom + gap;
      const roomAbove = referenceRect.top - viewportTop;
      const roomBelow = viewportBottom - referenceRect.bottom;
      const placeAbove = aboveTop >= viewportTop + margin || roomAbove >= roomBelow;
      const unclampedTop = placeAbove ? aboveTop : belowTop;
      const maxTop = Math.max(viewportTop + margin, viewportBottom - previewRect.height - margin);
      const top = Math.min(Math.max(unclampedTop, viewportTop + margin), maxTop);
      const maxLeft = Math.max(viewportLeft + margin, viewportRight - previewRect.width - margin);
      const left = Math.min(Math.max(center - previewRect.width / 2, viewportLeft + margin), maxLeft);
      const arrowLeft = Math.min(Math.max(center - left, 14), Math.max(14, previewRect.width - 14));
      preview.dataset.placement = placeAbove ? 'above' : 'below';
      preview.style.setProperty('--wiki-footnote-arrow-left', `${arrowLeft}px`);
      preview.style.left = `${left}px`;
      preview.style.top = `${top}px`;
      preview.style.visibility = '';
    }

    function showWikiFootnotePreview(reference) {
      activeWikiFootnotePreviewReference = reference;
      positionWikiFootnotePreview(reference);
    }

    function hideWikiFootnotePreview(reference) {
      if (reference && activeWikiFootnotePreviewReference !== reference) return;
      activeWikiFootnotePreviewReference = null;
      const preview = document.querySelector('[data-wiki-footnote-preview-box]');
      if (preview) preview.classList.remove('is-visible');
    }

    function bindContentImages(container) {
      container.querySelectorAll('[data-jbl-image], [data-note-image]').forEach(image => {
        if (image.dataset.imageEventsBound) return;
        image.dataset.imageEventsBound = 'true';
        let warning, pathLabel, retry;
        const showError = () => {
          // A failed lazy image is hidden below; future retries/source switches
          // must still load even while that image has no layout box.
          image.loading = 'eager';
          if (!warning) {
            warning = document.createElement('div');
            warning.className = 'content-image-error';
            warning.setAttribute('role', 'status');
            const message = document.createElement('span');
            message.textContent = '이미지를 불러오지 못했습니다. 아래 경로의 파일이 함께 저장·업로드되어 있는지 확인해 주세요.';
            pathLabel = document.createElement('code');
            pathLabel.className = 'content-image-error-path';
            retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'jbl-btn jbl-btn-sub';
            retry.textContent = '다시 불러오기';
            retry.addEventListener('click', event => {
              event.stopPropagation();
              retry.disabled = true;
              let source = image.getAttribute('src');
              // Refresh only this image; never guess a different question's file.
              try {
                const url = new URL(source, document.baseURI);
                if (['http:', 'https:'].includes(url.protocol)) {
                  url.searchParams.set('_imageRetry', String(Date.now()));
                  source = url.href;
                }
              } catch (_) {}
              image.src = source;
            });
            warning.append(message, pathLabel, retry);
            image.insertAdjacentElement('afterend', warning);
          }
          let source = image.getAttribute('src') || '(이미지 경로 없음)';
          try { source = decodeURI(source); } catch (_) {}
          pathLabel.textContent = source;
          retry.disabled = false;
          warning.hidden = false;
          image.classList.add('content-image-failed');
        };
        const showImage = () => {
          image.classList.remove('content-image-failed');
          if (warning) warning.hidden = true;
          if (retry) retry.disabled = false;
        };
        image.addEventListener('error', showError);
        image.addEventListener('load', showImage);
        image.addEventListener('click', () => {
          if (image.naturalWidth > 0) openJblImage(image.src);
        });
        // Cached failures may have fired before this card's listeners were bound.
        if (image.complete && image.naturalWidth === 0 && image.getAttribute('src')) showError();
      });
    }
