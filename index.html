    function renderLectureNote(course, target) {
      const source = lectureNoteSources[course.id];
      if (!source) return false;
      if (noteEditingCourseId === course.id) {
        target.innerHTML = `<section class="wiki-editor-shell"><div class="wiki-editor-head"><div><h3>문서 편집</h3><p>위키 문법으로 문단 링크, 다른 강의 링크, 각주와 사진을 편집할 수 있습니다.</p></div></div><textarea class="wiki-source-editor" data-wiki-source spellcheck="false">${escapeHtml(source)}</textarea>${wikiSyntaxHelpMarkup()}<div class="wiki-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-wiki-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-wiki-save>저장하기</button><button class="jbl-btn jbl-save-btn" type="button" data-wiki-save-files>현재 파일 저장</button></div></section>`;
        const applySource = () => {
          lectureNoteSources[course.id] = target.querySelector('[data-wiki-source]').value;
          window.LECTURE_NOTE_SOURCES = lectureNoteSources;
          jblHasUnsavedChanges = true;
        };
        target.querySelector('[data-wiki-cancel]').addEventListener('click', () => { noteEditingCourseId = null; renderContentPanel(course); });
        target.querySelector('[data-wiki-save]').addEventListener('click', () => { applySource(); noteEditingCourseId = null; renderContentPanel(course); });
        target.querySelector('[data-wiki-save-files]').addEventListener('click', () => { applySource(); noteEditingCourseId = null; renderContentPanel(course); saveCurrentFiles(); });
        return true;
      }
      target.innerHTML = renderWikiDocument(source, course);
      bindWikiDocument(target, course);
      return true;
    }

    function questionExplanationMarkup(question) {
      const course = byId(question.lectureIds?.[0]) || emptyRenderCourse;
      const images = (question.explanationImages || []).map(item => typeof item === 'string' ? {src:item} : item).filter(item => item?.src);
      const lecturePills = questionLectureIds(question).map(id => `<span class="jbl-lecture-map">${escapeHtml(questionLectureLabel(id))}</span>`).join('');
      return `<section class="jbl-explanation" data-explanation-number="${question.globalNumber}"><div class="jbl-answer-box">${renderJblWikiFragment(question.answerLabel, question, 'answer')}</div><div class="jbl-lecture-row">${lecturePills}<span class="jbl-professor-name">${escapeHtml(questionExaminerLabel(question))}</span></div>${images.length ? `<div class="jbl-page-block">${images.map(item => `<figure><img class="jbl-page-img" data-jbl-image src="${escapeHtml(encodeURI(item.src))}" alt="${escapeHtml(item.caption || question.displayId+' 해설 그림')}" />${item.caption ? `<figcaption>${renderWikiInline(item.caption,course,{items:[],named:new Map()},false)}</figcaption>` : ''}</figure>`).join('')}</div>` : ''}<div class="jbl-explanation-text">${question.explanation?.trim() ? renderJblWikiFragment(question.explanation, question, 'explanation') : '<p class="jbl-explanation-empty">아직 작성된 해설이 없습니다.</p>'}</div></section>`;
    }

    function questionCardMarkup(question, state) {
      if (question.studyKind==='wiki') return lectureJblWikiCardMarkup(question);
      const wikiCourse = byId(question.lectureIds?.[0]) || emptyRenderCourse;
      const renderJblInline = value => renderWikiInline(value, wikiCourse, { items:[], named:new Map() }, false);
      const selected = state.selected[question.id];
      const revealAnswer = Boolean(state.answerShown[question.id]);
      const answerIndices = Array.isArray(question.answerIndices) && question.answerIndices.length ? question.answerIndices : (question.answerIndex ? [question.answerIndex] : []);
      const selectedIndices = Array.isArray(selected) ? selected : (selected ? [selected] : []);
      const isMultipleAnswer = answerIndices.length > 1;
      const selectionComplete = isMultipleAnswer && selectedIndices.length === answerIndices.length;
      const choices = question.choices.length ? `<div class="jbl-choices">${question.choices.map((choice,index) => {
        const number = index + 1;
        let status = '';
        if (revealAnswer) {
          if (answerIndices.includes(number)) status = ' correct';
          else if (selectedIndices.includes(number)) status = answerIndices.length ? ' wrong' : ' selected';
        } else if (state.feedbackHidden?.[question.id] || (isMultipleAnswer && !selectionComplete)) {
          if (selectedIndices.includes(number)) status = ' selected';
        } else if (selectedIndices.length) {
          if (answerIndices.includes(number)) status = ' correct';
          if (selectedIndices.includes(number) && answerIndices.length && !answerIndices.includes(number)) status = ' wrong';
        }
        return `<button class="jbl-choice${status}" type="button" data-jbl-choice="${number}"><span class="jbl-choice-num">${number}</span><span>${renderJblInline(choice)}</span></button>`;
      }).join('')}</div>` : '';
      const passageText = (question.passage || '').trim();
      const passage = passageText ? `<section class="jbl-passage" aria-label="제시문"><div class="jbl-passage-title">제시문</div><div class="jbl-passage-text">${renderJblWikiFragment(passageText, question, 'passage')}</div></section>` : '';
      const images = question.images.length ? `<div class="jbl-page-block">${question.images.map(filename => `<figure style="margin:0"><img class="jbl-page-img" data-jbl-image src="${escapeHtml(encodeURI(filename))}" alt="${escapeHtml(question.displayId)} 문항 이미지" /></figure>`).join('')}</div>` : '';
      const isEditing = state.editing === question.id;
      const lectureEditor = isEditing ? `<div class="jbl-editor-field full"><label>강의 분류 · 여러 강의를 함께 선택할 수 있습니다.</label><details class="jbl-lecture-picker" data-jbl-edit-lecture-picker><summary>${escapeHtml(questionCourseText(question) || '강의를 선택하세요')}</summary><div class="jbl-lecture-options">${questionEditableCourses().map(course => `<label class="jbl-lecture-option"><input type="checkbox" value="${course.id}" data-jbl-edit-lecture ${questionBelongsToCourse(question, course.id) ? 'checked' : ''} /><span>${escapeHtml(contentCourseText(course))} · ${escapeHtml(course.professor)} 교수</span></label>`).join('')}</div></details><p class="jbl-editor-validation" data-jbl-edit-lecture-error hidden>강의를 하나 이상 선택하세요.</p></div>` : '';
      const editor = isEditing ? `<section class="jbl-editor jbl-question-editor" aria-label="문제 수정"><div class="jbl-editor-grid">${lectureEditor}<div class="jbl-editor-field full"><label for="jbl-edit-question-${escapeHtml(question.id)}">문제 발문</label><textarea id="jbl-edit-question-${escapeHtml(question.id)}" data-jbl-edit-question>${escapeHtml(question.question)}</textarea></div><div class="jbl-editor-field full"><label for="jbl-edit-passage-${escapeHtml(question.id)}">제시문 · ㄱ/ㄴ/ㄷ/ㄹ, I/II/III 등</label><textarea id="jbl-edit-passage-${escapeHtml(question.id)}" data-jbl-edit-passage>${escapeHtml(question.passage || '')}</textarea></div><div class="jbl-editor-field full"><label for="jbl-edit-choices-${escapeHtml(question.id)}">선지 · 한 줄에 하나씩 입력</label><textarea id="jbl-edit-choices-${escapeHtml(question.id)}" data-jbl-edit-choices>${escapeHtml(question.choices.join('\n'))}</textarea></div><div class="jbl-editor-field"><label for="jbl-edit-indices-${escapeHtml(question.id)}">정답 번호 · 복수 정답은 쉼표로 구분</label><input id="jbl-edit-indices-${escapeHtml(question.id)}" data-jbl-edit-indices type="text" inputmode="numeric" value="${escapeHtml(answerIndices.join(', '))}" placeholder="예: 2 또는 2, 4" /></div><div class="jbl-editor-field"><label for="jbl-edit-label-${escapeHtml(question.id)}">정답 표시</label><input id="jbl-edit-label-${escapeHtml(question.id)}" data-jbl-edit-label type="text" value="${escapeHtml(question.answerLabel)}" /></div><div class="jbl-editor-field full"><label for="jbl-edit-explanation-${escapeHtml(question.id)}">해설</label><textarea id="jbl-edit-explanation-${escapeHtml(question.id)}" data-jbl-edit-explanation>${escapeHtml(question.explanation)}</textarea></div></div><p class="jbl-editor-help">강의 분류·발문·제시문·선지·정답·해설을 한 번에 수정합니다. Wiki와 같은 문법 및 {{123}} 형식의 문항 링크를 사용할 수 있습니다.</p>${wikiSyntaxHelpMarkup()}<div class="jbl-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-edit-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-jbl-edit-apply>수정 반영</button></div></section>` : '';
      return `<article class="jbl-card" data-jbl-question="${escapeHtml(question.id)}">
        <header class="jbl-card-head"><div class="jbl-meta"><div class="jbl-author-source"><span class="jbl-prof">${escapeHtml(questionExaminerLabel(question))}</span><div class="jbl-source">${escapeHtml(question.source)}</div></div><div class="jbl-meta-right">${questionStudyStatusMarkup(question.id)}<button class="jbl-qid" type="button" data-jbl-number-button aria-label="${escapeHtml(question.displayId)} · 번호 입력하여 이동" title="번호를 입력하여 이동" ${state.editing ? 'disabled' : ''}>${escapeHtml(question.displayId)}</button><input class="jbl-number-input" data-jbl-number-input type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]*" autocomplete="off" aria-label="이동할 J 고유번호" value="${question.globalNumber}" hidden /><button class="jbl-favorite ${jblFavorites.has(question.id) ? 'active' : ''}" type="button" data-jbl-favorite aria-label="${jblFavorites.has(question.id) ? '즐겨찾기 해제' : '즐겨찾기 추가'}" aria-pressed="${jblFavorites.has(question.id)}">${jblFavorites.has(question.id) ? '★' : '☆'}</button></div></div><h2 class="jbl-title">${renderJblInline(question.question)}</h2></header>
        <div class="jbl-card-body">${passage}${images}${choices}${editor}</div>
      </article>`;
    }

    function bindQuestionCard(container, questions, key, rerender) {
      const state = viewerState(key);
      const question = questions[state.index];
      if (!question) return;
      if (question.studyKind==='wiki') { bindLectureJblWikiCard(container,question);return; }
      const numberButton = container.querySelector('[data-jbl-number-button]');
      const numberInput = container.querySelector('[data-jbl-number-input]');
      let enteringNumber = false;
      const outsideNumber = event => {
        if (event.target === numberInput || event.target === numberButton) return;
        finishNumber();
      };
      const finishNumber = (cancel = false) => {
        if (!enteringNumber) return;
        enteringNumber = false;
        document.removeEventListener('pointerdown',outsideNumber,true);
        const value = numberInput.value.trim();
        numberInput.hidden = true;
        numberButton.hidden = false;
        numberInput.value = String(question.globalNumber);
        if (!container.isConnected || cancel || !value || Number(value) === Number(question.globalNumber)) return;
        const destination = /^\d+$/.test(value) && jblQuestions.find(item => Number(item.globalNumber) === Number(value));
        if (!destination) { alert('해당 고유번호의 문항이 없습니다.'); return; }
        if (!container.isConnected) return;
        if (container.closest('[data-explanation-question-root]')) closeQuestionExplanationSplit(false);
        if (key.startsWith('context-link-question-')) {
          const current = contextLinkState.stack.at(-1);
          const wikiSequence = current?.wikiSequence?.numbers.includes(Number(value)) ? current.wikiSequence : undefined;
          showContextLinkTarget({type:'j',questionNumber:Number(value),wikiSequence},true);
        } else if (key.startsWith('course-jbl-')) {
          const course=lectureStudyCourseForKey(key);
          if (!jumpLectureJblQuestion(course,destination)) openContextLinkSplit({type:'j',questionNumber:Number(value)},numberButton);
        } else if (key.startsWith('course-')) {
          const course = byId(Number(key.slice(7)));
          if (questionBelongsToCourse(destination,course.id)) {
            if (!lectureStudyQuestions(course).some(item => item.id === destination.id)) lectureStudyState(course).chapter = '';
            state.index = lectureStudyQuestions(course).findIndex(item => item.id === destination.id);
            rerender();
            scrollLectureStudyQuestion(document.querySelector('[data-course-j-host]'));
          } else openContextLinkSplit({type:'j',questionNumber:Number(value)},numberButton);
        } else openJblQuestionNumber(Number(value));
      };
      numberButton?.addEventListener('click', () => {
        enteringNumber = true;
        numberButton.hidden = true;
        numberInput.hidden = false;
        document.addEventListener('pointerdown',outsideNumber,true);
        numberInput.focus({preventScroll:true});
        numberInput.select();
      });
      numberInput?.addEventListener('blur', () => finishNumber());
      numberInput?.addEventListener('keydown', event => {
        if (event.isComposing) return;
        if (event.key === 'Enter' || event.key === 'Escape') {
          event.preventDefault(); event.stopPropagation();
          finishNumber(event.key === 'Escape');
          if (numberButton.isConnected) numberButton.focus({preventScroll:true});
        }
      });
      bindWikiDocument(container, byId(question.lectureIds?.[0]) || emptyRenderCourse);
      container.querySelectorAll('[data-jbl-choice]').forEach(button => button.addEventListener('click', event => {
        if (event.target.closest('a')) return;
        const choiceNumber = Number(button.dataset.jblChoice);
        const answerIndices = Array.isArray(question.answerIndices) && question.answerIndices.length ? question.answerIndices : (question.answerIndex ? [question.answerIndex] : []);
        if (state.answerShown[question.id] || state.explanationShown[question.id]) markQuestionPeeked(state, question);
        state.answerShown[question.id] = false;
        state.explanationShown[question.id] = false;
        if (state.feedbackHidden) delete state.feedbackHidden[question.id];
        if (answerIndices.length > 1) {
          const current = Array.isArray(state.selected[question.id]) ? state.selected[question.id].slice() : [];
          const existingIndex = current.indexOf(choiceNumber);
          if (existingIndex >= 0) current.splice(existingIndex, 1);
          else if (current.length < answerIndices.length) current.push(choiceNumber);
          state.selected[question.id] = current;
        } else {
          state.selected[question.id] = choiceNumber;
        }
        recordQuestionAttempt(state, question, answerIndices);
        rerender();
      }));
      container.querySelector('[data-study-status]')?.addEventListener('change', event => {
        saveQuestionStudyStatus(question.id, event.currentTarget.value, true);
      });
      container.querySelector('[data-jbl-favorite]')?.addEventListener('click', () => {
        if (jblFavorites.has(question.id)) jblFavorites.delete(question.id);
        else jblFavorites.add(question.id);
        saveJblFavorites();
        rerender();
      });
      container.querySelector('[data-jbl-edit-cancel]')?.addEventListener('click', () => {
        state.editing = null;
        rerender();
      });
      container.querySelectorAll('[data-jbl-edit-lecture]').forEach(checkbox => checkbox.addEventListener('change', () => {
        container.querySelector('[data-jbl-edit-lecture-error]')?.setAttribute('hidden', '');
      }));
      container.querySelector('[data-jbl-edit-apply]')?.addEventListener('click', () => {
        const editedQuestion = container.querySelector('[data-jbl-edit-question]').value.trim();
        const editedPassage = container.querySelector('[data-jbl-edit-passage]').value.split(/\r?\n/).map(line => line.trim()).filter(Boolean).join('\n');
        const editedChoices = container.querySelector('[data-jbl-edit-choices]').value.split(/\r?\n/).map(choice => choice.trim()).filter(Boolean);
        const editedLectureIds = [...container.querySelectorAll('[data-jbl-edit-lecture]:checked')].map(checkbox => Number(checkbox.value)).filter(id => questionMappedCourse(id));
        if (!editedLectureIds.length) {
          const picker = container.querySelector('[data-jbl-edit-lecture-picker]');
          const error = container.querySelector('[data-jbl-edit-lecture-error]');
          if (picker) picker.open = true;
          if (error) error.hidden = false;
          picker?.scrollIntoView({ behavior:'smooth', block:'center' });
          return;
        }
        if (!editedQuestion) return;
        const editedIndices = [...new Set(container.querySelector('[data-jbl-edit-indices]').value.split(/[,·/\s]+/).map(Number).filter(index => Number.isInteger(index) && index >= 1 && index <= editedChoices.length))];
        const answerLabel = container.querySelector('[data-jbl-edit-label]').value.trim();
        const explanation = container.querySelector('[data-jbl-edit-explanation]').value.trim();
        question.question = editedQuestion;
        question.passage = editedPassage;
        question.choices = editedChoices;
        question.answerIndices = editedIndices;
        question.answerIndex = editedIndices.length === 1 ? editedIndices[0] : null;
        const numberText = editedIndices.join('·');
        const choiceText = editedIndices.map(index => editedChoices[index - 1]).join(' / ');
        question.answerLabel = answerLabel || (editedIndices.length ? `정답: ${numberText}번${choiceText ? ` · ${choiceText}` : ''}` : '정답: 미입력');
        question.explanation = explanation;
        const primaryCourse = questionMappedCourse(editedLectureIds[0]);
        question.lectureIds = editedLectureIds;
        question.lectureId = primaryCourse.id;
        question.lectureTitle = contentTitleText(primaryCourse);
        // Changing a lecture must not replace the historical exam author.
        if (!String(question.legacyProfessor || '').trim()) question.legacyProfessor = questionExamProfessor(question);
        question.professor = primaryCourse.professor;
        question.domain = primaryCourse.domain;
        question.discipline = primaryCourse.discipline;
        question.section = primaryCourse.section;
        question.mappingConfidence = '사이트에서 직접 수정';
        delete state.selected[question.id];
        window.JBL_DATA.modifiedAt = new Date().toISOString();
        jblHasUnsavedChanges = true;
        state.editing = null;
        state.answerShown[question.id] = true;
        state.explanationShown[question.id] = true;
        rerender();
        openQuestionExplanationSplit(state, question, rerender);
      });
    }

    function renderQuestionCard(container, questions, key, rerender) {
      container.questionViewer = { questions, key, rerender };
      const state = viewerState(key);
      if (!container.hasAttribute('data-explanation-question-root')) questionExplanationViewers.set(state, {...container.questionViewer, container});
      state.index = Math.max(0, Math.min(state.index, Math.max(questions.length - 1, 0)));
      if (!questions.length) {
        container.innerHTML = `<div class="jbl-empty"><strong>${key === 'jbl-all' ? '필터 조건에 맞는 문항이 없습니다.' : '이 강의에 연결된 기출 문항이 없습니다.'}</strong></div>`;
        if (questionExplanationState.active && questionExplanationState.state === state) syncQuestionExplanationSplit();
        return;
      }
      container.innerHTML = questionCardMarkup(questions[state.index], state);
      bindQuestionCard(container, questions, key, rerender);
      if (questionExplanationState?.active && questionExplanationState.state === state && !container.hasAttribute('data-explanation-question-root')) syncQuestionExplanationSplit();
    }

    function toggleQuestionExplanation(state, question, rerender) {
      if (!question || question.studyKind==='wiki') return;
      const restoreFocus = document.activeElement?.hasAttribute('data-jbl-explanation');
      const shown = !state.explanationShown[question.id];
      if (!shown && questionExplanationState.active && questionExplanationState.state === state) {
        closeQuestionExplanationSplit();
        return;
      }
      if (shown) markQuestionPeeked(state, question);
      state.answerShown[question.id] = shown;
      state.explanationShown[question.id] = shown;
      (state.feedbackHidden ||= {})[question.id] = !shown;
      rerender();
      if (shown) openQuestionExplanationSplit(state, question, rerender);
      if (restoreFocus) {
        const nav = questionExplanationState.active ? questionExplanationState.nav : contextLinkState.active ? contextLinkState.nav : document.querySelector('#jbl-view:not([hidden]) .jbl-bottom-inner, #detail-view:not([hidden]) [data-course-j-nav]');
        nav?.querySelector('[data-jbl-explanation]')?.focus({preventScroll:true});
      }
    }

    function studyQuestionViewer() {
      if (questionExplanationState.active) return questionExplanationState.viewer;
      if (contextLinkState.active) return contextLinkState.body?.querySelector('[data-context-question-root]')?.questionViewer || null;
      return activeQuestionViewer();
    }

    function editStudyQuestion() {
      const viewer = studyQuestionViewer();
      if (!viewer) return;
      if (questionExplanationState.active) closeQuestionExplanationSplit(false);
      const state = viewerState(viewer.key), question = viewer.questions[state.index];
      if (!question || question.studyKind==='wiki') return;
      state.editing = state.editing === question.id ? null : question.id;
      viewer.rerender();
    }

    function navMarkup(state, questions, context = false) {
      const question = questions[state.index], editing = question && state.editing === question.id;
      const wikiCard=question?.studyKind==='wiki';
      const previous = context ? 'data-context-question-prev' : 'data-jbl-prev';
      const next = context ? 'data-context-question-next' : 'data-jbl-next';
      const shown = Boolean(question && state.explanationShown[question.id]);
      return `<button class="jbl-btn jbl-btn-primary jbl-nav-explanation" type="button" data-jbl-explanation aria-pressed="${shown}" ${!question || editing || wikiCard ? 'disabled' : ''}>${shown ? '해설 닫기' : '해설 보기'}</button><div class="jbl-nav-pages"><button class="jbl-btn jbl-btn-primary jbl-nav-previous" type="button" ${previous} aria-label="이전 문제" ${!question || state.index <= 0 || editing ? 'disabled' : ''}><span class="jbl-nav-arrow" aria-hidden="true">← </span>이전 문제</button><span class="jbl-counter">${questions.length ? state.index + 1 : 0} / ${questions.length}</span><button class="jbl-btn jbl-btn-primary jbl-nav-next" type="button" ${next} aria-label="다음 문제" ${!question || state.index >= questions.length - 1 || editing ? 'disabled' : ''}>다음 문제<span class="jbl-nav-arrow" aria-hidden="true"> →</span></button></div>`;
    }

    function scrollCurrentQuestionToTop(key) {
      requestAnimationFrame(() => {
        const standalone = key === 'jbl-all';
        const scope = document.querySelector(standalone ? '#jbl-standalone' : '#content-panel');
        const lecturePane = !standalone && scope?.querySelector('[data-course-j-host]');
        if (lecturePane) { scrollLectureStudyQuestion(lecturePane); return; }
        const card = scope?.querySelector('.jbl-card');
        if (!card) return;
        const mobileStandalone = standalone && window.matchMedia('(max-width: 760px)').matches;
        if (mobileStandalone) {
          jblQuestionScrollLockedUntil = Date.now() + 900;
          setJblTopbarHidden(true);
        }
        const topbar = standalone && !mobileStandalone ? scope.querySelector('.jbl-topbar') : null;
        const topbarOffset = document.body.classList.contains('study-ui') ? document.querySelector('.masthead').getBoundingClientRect().height + 12 : (topbar ? topbar.getBoundingClientRect().height + 8 : 0);
        const cardTop = window.scrollY + card.getBoundingClientRect().top - topbarOffset;
        window.scrollTo({ top:Math.max(0, cardTop), behavior:'smooth' });
      });
    }

    function bindViewerNav(container, questions, key, rerender) {
      const state = viewerState(key);
      container.querySelector('[data-jbl-prev]')?.addEventListener('click', () => { state.index -= 1; rerender(); scrollCurrentQuestionToTop(key); });
      container.querySelector('[data-jbl-next]')?.addEventListener('click', () => { state.index += 1; rerender(); scrollCurrentQuestionToTop(key); });
      container.querySelector('[data-jbl-explanation]')?.addEventListener('click', () => toggleQuestionExplanation(state, questions[state.index], rerender));
    }

    function downloadCurrentFile(filename, contents, type, delay = 0) {
      window.setTimeout(() => {
        const blob = new Blob([contents], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1200);
      }, delay);
    }

    function saveCurrentFiles() {
      const clone = document.documentElement.cloneNode(true);
      // A downloaded site must not impose this browser's theme on other users.
      clone.removeAttribute('data-theme');
      clone.style.removeProperty('--study-text-scale');
      clone.querySelector('#study-control-center')?.remove();
      clone.querySelector('#study-primary-nav')?.remove();
      clone.querySelector('[data-study-handle]')?.remove();
      clone.querySelector('[data-study-tools]')?.remove();
      clone.querySelector('[data-study-search]')?.remove();
      clone.querySelector('[data-study-context]')?.remove();

    function renderJblStandalone() {
      const target = document.querySelector('#jbl-standalone');
      const key = 'jbl-all';
      const state = standaloneState();
      const linkedMode = Boolean(state.linkedQuestionNumber);
      const questions = currentStandaloneQuestions();
      state.index = Math.max(0, Math.min(state.index, Math.max(questions.length - 1, 0)));
      const currentQuestion = questions[state.index];
      if (linkedMode && currentQuestion && state.linkedQuestionNumber !== Number(currentQuestion.globalNumber)) {
        state.linkedQuestionNumber = Number(currentQuestion.globalNumber);
        // Adjacent navigation stays in the same history entry so Back returns to the source view.
        if (/^#jbl-q-\d+$/.test(location.hash)) {
          history.replaceState({ ...(history.state || {}), jblLinkedQuestion:state.linkedQuestionNumber }, '', `#jbl-q-${state.linkedQuestionNumber}`);
        }
      }
      const years = [...new Set(jblQuestions.map(question => Number(question.year)).filter(Boolean))].sort((a,b) => b-a);
      const lectureIds = [...new Set(jblQuestions.flatMap(questionLectureIds))].sort((a,b) => a-b);
      const professors = [...new Set(jblQuestions.map(questionExamProfessor).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ko'));
      const filterPanel = state.panel === 'filter' ? `<section class="jbl-filter-panel" aria-label="문항 필터"><h2 class="jbl-filter-title">필터</h2><div class="jbl-filter-grid"><div class="jbl-filter-item"><label for="jbl-filter-year">연도</label><select id="jbl-filter-year" class="jbl-select" data-jbl-filter-year multiple size="4" aria-label="연도 복수 선택">${years.map(year => `<option value="${year}" ${jblFilterValues(state.filters.year).includes(String(year)) ? 'selected' : ''}>${year}</option>`).join('')}</select></div><div class="jbl-filter-item"><label for="jbl-filter-lecture">강의명</label><select id="jbl-filter-lecture" class="jbl-select" data-jbl-filter-lecture multiple size="4" aria-label="강의 복수 선택">${lectureIds.map(id => `<option value="${id}" ${jblFilterValues(state.filters.lectureId).includes(String(id)) ? 'selected' : ''}>${escapeHtml(questionLectureLabel(id))}</option>`).join('')}</select></div><div class="jbl-filter-item"><label for="jbl-filter-professor">출제교수</label><select id="jbl-filter-professor" class="jbl-select" data-jbl-filter-professor multiple size="4" aria-label="출제교수 복수 선택">${professors.map(professor => `<option value="${escapeHtml(professor)}" ${jblFilterValues(state.filters.professor).includes(professor) ? 'selected' : ''}>${escapeHtml(professor)} 교수</option>`).join('')}</select></div><div class="jbl-filter-item"><label>즐겨찾기</label><label class="jbl-favorite-filter"><input type="checkbox" data-jbl-filter-favorites ${state.filters.favoritesOnly ? 'checked' : ''} /> 즐겨찾기한 문제만 보기</label><label class="jbl-favorite-filter"><input type="checkbox" data-jbl-filter-wrong ${state.filters.wrongOnly ? 'checked' : ''} /> 틀린 문항만 보기</label></div></div><p class="jbl-filter-summary">전체 ${jblQuestions.length}문항 중 ${questions.length}문항 표시${state.randomOrder.length ? ' · 랜덤 순서' : ''}</p>${state.filters.wrongOnly ? '<div class="jbl-wrong-session"><span>다시 맞힌 문항은 다음 복습부터 제외됩니다.</span><button type="button" data-wrong-restart>남은 오답으로 다시 시작</button></div>' : ''}</section>` : '';
      const settingsPanel = state.panel === 'settings' ? `<section class="jbl-filter-panel" aria-label="JBL 설정"><h2 class="jbl-filter-title">설정</h2><div class="jbl-settings-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-random>문항 랜덤 표시</button><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-reset>초기화</button><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-exit>강의 화면</button><button class="jbl-btn jbl-save-btn" type="button" data-jbl-save-files>현재 파일 저장</button></div></section>` : '';
      target.innerHTML = `<div class="jbl-wrap"><section class="jbl-panel jbl-topbar"><div class="jbl-top-actions">${linkedMode ? `<button class="jbl-btn jbl-btn-sub" type="button" data-jbl-linked-back>← 돌아가기</button>` : `<button class="jbl-btn jbl-btn-sub jbl-toolbar-btn ${state.panel === 'filter' ? 'active' : ''}" type="button" data-jbl-panel="filter" aria-expanded="${state.panel === 'filter'}">필터</button><button class="jbl-btn jbl-btn-sub jbl-toolbar-btn ${state.panel === 'settings' ? 'active' : ''}" type="button" data-jbl-panel="settings" aria-expanded="${state.panel === 'settings'}">설정</button>`}<button class="jbl-btn jbl-btn-primary" type="button" data-jbl-home>홈으로</button></div><div class="jbl-jump-box"><label for="jbl-jump" style="font-size:14px;font-weight:800;color:#475569">문제 번호 이동</label><input id="jbl-jump" type="text" inputmode="numeric" placeholder="예: 472" /><button class="jbl-btn jbl-btn-primary" type="button" data-jbl-jump>이동</button></div></section>${linkedMode ? '' : filterPanel}${linkedMode ? '' : settingsPanel}<div data-jbl-root></div></div><div class="jbl-bottom-nav"><div class="jbl-bottom-inner">${navMarkup(state, questions)}</div></div>`;
      const themeButton = document.createElement('button');
      themeButton.className = 'theme-button';
      themeButton.type = 'button';
      themeButton.dataset.themeToggle = '';
      target.querySelector('.jbl-top-actions').append(themeButton);
      window.RespiratoryTheme.syncButtons();
      const rerender = renderJblStandalone;
      renderQuestionCard(target.querySelector('[data-jbl-root]'), questions, key, rerender);
      bindViewerNav(target.querySelector('.jbl-bottom-inner'), questions, key, rerender);
      bindCurrentFileSave(target);
      target.querySelector('[data-jbl-linked-back]')?.addEventListener('click', () => history.back());
      target.querySelectorAll('[data-jbl-panel]').forEach(button => button.addEventListener('click', () => {
        state.panel = state.panel === button.dataset.jblPanel ? null : button.dataset.jblPanel;
        renderJblStandalone();
      }));
      const updateFilter = (name, value) => {
        state.filters[name] = value;
        if (name === 'wrongOnly') {
          state.wrongBatch = value ? wrongQuestionIds() : null;
          freshQuestionAttempt(state);
        }
        state.index = 0;
        clearJblRandomOrder(state);
        renderJblStandalone();
      };
      target.querySelector('[data-jbl-filter-year]')?.addEventListener('change', event => updateFilter('year', Array.from(event.target.selectedOptions, option => option.value)));
      target.querySelector('[data-jbl-filter-lecture]')?.addEventListener('change', event => updateFilter('lectureId', Array.from(event.target.selectedOptions, option => option.value)));
      target.querySelector('[data-jbl-filter-professor]')?.addEventListener('change', event => updateFilter('professor', Array.from(event.target.selectedOptions, option => option.value)));
      target.querySelector('[data-jbl-filter-favorites]')?.addEventListener('change', event => updateFilter('favoritesOnly', event.target.checked));
      target.querySelector('[data-jbl-filter-wrong]')?.addEventListener('change', event => updateFilter('wrongOnly', event.target.checked));
      target.querySelector('[data-wrong-restart]')?.addEventListener('click', () => updateFilter('wrongOnly', true));
      target.querySelector('[data-jbl-random]')?.addEventListener('click', () => {
        const filtered = filteredJblQuestions();
        state.randomOrder = shuffleQuestions(filtered).map(question => question.id);
        state.randomSignature = jblFilterSignature(state.filters);
        state.index = 0;
        renderJblStandalone();
      });
      target.querySelector('[data-jbl-exit]')?.addEventListener('click', () => { renderDomainTabs(); renderCatalog(); showView('catalog'); });
      target.querySelector('[data-jbl-reset]')?.addEventListener('click', () => {
        state.linkedQuestionNumber = null;
        state.filters = { year:'', lectureId:'', professor:'', favoritesOnly:false, wrongOnly:false };
        state.wrongBatch = null; state.attempts = {};
        state.index = 0;
        state.selected = {};
        state.answerShown = {};
        state.explanationShown = {};
        state.editing = null;
        clearJblRandomOrder(state);
        renderJblStandalone();
      });
      target.querySelector('[data-jbl-home]')?.addEventListener('click', () => quickNavigate('#home'));
      const jump = () => {
        const value = target.querySelector('#jbl-jump').value.trim();
        const globalMatch = value.match(/^\s*(\d+)\s*번?\s*$/);
        if (globalMatch) {
          const globalNumber = Number(globalMatch[1]);
          openJblQuestionNumber(globalNumber);
          return;
        }
        const yearMatch = value.match(/20(?:20|21|22|23|25)/);
        const requestedYear = yearMatch ? Number(yearMatch[0]) : null;
        const withoutYear = value.replace(/20(?:20|21|22|23|25)/, ' ').trim();
        const numberMatch = withoutYear.match(/(\d+)/);
        let index = -1;
        if (numberMatch && /오답/.test(value)) {
          const number = Number(numberMatch[1]);
          index = questions.findIndex(question => question.sourceType === '오답30'
            && (!requestedYear || question.year === requestedYear)
            && (question.sourceOrdinal === number || question.id.endsWith(`wrong30-${number}`)));
        } else if (numberMatch) {
          const number = Number(numberMatch[1]);
          index = questions.findIndex(question => question.originalNumber === number
            && (!requestedYear || question.year === requestedYear));
        }
        if (index >= 0) { state.index=index; renderJblStandalone(); }
      };
      target.querySelector('[data-jbl-jump]')?.addEventListener('click', jump);
      target.querySelector('#jbl-jump')?.addEventListener('keydown', event => { if (event.key === 'Enter') jump(); });
      requestAnimationFrame(() => setJblTopbarHidden(jblTopbarHidden));
    }

    function openJblQuestionNumber(globalNumber) {
      const question = jblQuestions.find(item => item.globalNumber === Number(globalNumber));
      if (!question) return false;
      if (location.hash.startsWith('#lecture-')) {
        history.replaceState({ ...(history.state || {}), detailTab:activeDetailTab }, '', location.href);
      }
      const state = standaloneState();
      state.linkedQuestionNumber = Number(globalNumber);
      state.panel = null;
      state.index = jblQuestionsByNumber().findIndex(item => item.id === question.id);
      showView('jbl', false);
      history.pushState({ jblLinkedQuestion:Number(globalNumber) }, '', `#jbl-q-${globalNumber}`);
      renderJblStandalone();
      window.scrollTo({ top:0, behavior:'auto' });
      return true;
    }

    function renderDomainTabs() {
      const target = document.querySelector('#domain-tabs');
      target.innerHTML = Object.keys(domainMeta).map(domain => {
        const meta = domainMeta[domain];
        const count = courses.filter(course => course.domain === domain).length;
        return `<button class="domain-tab ${activeDomain === domain ? 'active' : ''}" style="--tab-color:${meta.accent};--tab-soft:${meta.soft}" data-domain="${domain}" type="button"><strong>${domain}</strong></button>`;
      }).join('');
      target.querySelectorAll('[data-domain]').forEach(button => button.addEventListener('click', () => {
        activeDomain = button.dataset.domain;
        renderDomainTabs();
        renderCatalog();
      }));
    }

    function renderCatalog() {
      const target = document.querySelector('#catalog');
      const domainCourses = courses.filter(course => course.domain === activeDomain);
      if (!domainCourses.length) { target.innerHTML='<div class="personal-note-empty">등록된 강의가 없습니다.</div>'; return; }
      const meta = domainMeta[activeDomain];
      const disciplines = [...new Set(domainCourses.map(course => course.discipline))].sort((a,b) => disciplineOrder.indexOf(a)-disciplineOrder.indexOf(b));
      target.innerHTML = `<div class="discipline-grid">${disciplines.map(discipline => {
        const disciplineCourses = domainCourses.filter(course => course.discipline === discipline);
        const [icon,en] = disciplineMeta[discipline];
        const sections = [...new Set(disciplineCourses.map(course => course.section))].sort((a,b) => sectionOrder.indexOf(a)-sectionOrder.indexOf(b));
        return `<article class="discipline-card" style="--accent:${meta.accent};--soft:${meta.soft}">
          <header class="discipline-head"><span class="discipline-icon" aria-hidden="true">${icon}</span><div><h3>${discipline}</h3></div><span class="discipline-count">${disciplineCourses.length}강</span></header>
          ${sections.map(section => {
            const sectionCourses = disciplineCourses.filter(course => course.section === section);
            const professors = [...new Set(sectionCourses.map(course => course.professor))].sort((a,b) => {
              const minA = Math.min(...sectionCourses.filter(c => c.professor === a).map(c => c.id));
              const minB = Math.min(...sectionCourses.filter(c => c.professor === b).map(c => c.id));
              return minA-minB;
            });
            const showSection = sections.length > 1 || section !== discipline;
            return `<section class="section-block">${showSection ? `<h4 class="section-title">${section}</h4>` : ''}<div class="professor-list">
              ${professors.map(professor => {
                const lectures = sectionCourses.filter(course => course.professor === professor).sort((a,b) => a.id-b.id);
                return `<div class="professor"><button class="professor-toggle" type="button" aria-expanded="false"><span class="professor-name">${professor} 교수</span><span class="professor-meta">${lectures.length}개 강의</span><span class="chevron" aria-hidden="true">⌄</span></button><ul class="lecture-list">${lectures.map(course => `<li><button class="lecture-link" type="button" data-course="${course.id}"><span class="lecture-no">${course.id}</span><span>${titleText(course)}</span><small>${course.slots[0] ? `${course.slots[0].week}주차` : ''}</small><span class="lecture-arrow" aria-hidden="true">→</span></button></li>`).join('')}</ul></div>`;
              }).join('')}
            </div></section>`;
          }).join('')}
        </article>`;
      }).join('')}</div>`;

      target.querySelectorAll('.professor-toggle').forEach(button => button.addEventListener('click', () => {
        const professor = button.closest('.professor');
        const isOpen = professor.classList.toggle('open');
        button.setAttribute('aria-expanded', String(isOpen));
      }));
      target.querySelectorAll('[data-course]').forEach(button => button.addEventListener('click', () => showDetail(button.dataset.course, 'catalog')));
    }

    const scheduleBeeProfessors = new Set(['김영삼', '윤용한', '이만종', '임대현', '임종한', '임준혁']);
    const scheduleOpProfessors = new Set(['김영삼']);
    let scheduleOpVisible = false;

    function renderScheduleOp(course) {

      const bee = '<img class="course-op-image" src="./assets/op-bee.png" alt="" aria-hidden="true" draggable="false" decoding="async">';
      if (!scheduleOpProfessors.has(professor)) return bee;
      return '<span class="course-op-stack" aria-hidden="true">' + bee + '<img class="course-op-badge" src="./assets/op-badge.png" width="1672" height="941" alt="" aria-hidden="true" draggable="false" decoding="async"></span>';

    function syncScheduleOp() {
      document.querySelector('#schedule-view').classList.toggle('op-visible', scheduleOpVisible);
      const button = document.querySelector('[data-schedule-op]');
      button.setAttribute('aria-pressed', String(scheduleOpVisible));
      button.setAttribute('aria-label', scheduleOpVisible ? 'OP 숨기기' : 'OP 표시');

    document.querySelector('[data-schedule-op]').addEventListener('click', () => {
      scheduleOpVisible = !scheduleOpVisible;
      syncScheduleOp();

    function renderSchedule() {
      const target = document.querySelector('#week-stack');
      if (!Object.keys(weekCalendar).length) { target.innerHTML='<div class="personal-note-empty">등록된 수업 일정이 없습니다.</div>'; syncScheduleOp(); return; }
      const weeks = Object.keys(weekCalendar).map(Number).sort((a,b) => weekCalendar[a].월.localeCompare(weekCalendar[b].월));
      target.innerHTML = weeks.map(week => {
        const weekSlots = courses.flatMap(course => course.slots.filter(slot => slot.week === week).map(slot => ({course,slot})));
        const weekDates = weekCalendar[week];
        return `<article class="week-card" data-schedule-week="${week}"><div class="week-title"><strong>${week}주차</strong><span>${formatDate(weekDates.월)} – ${formatDate(weekDates.금)}</span></div><div class="timetable-scroll"><div class="timetable">
          <div class="grid-cell day-head" style="grid-column:1;grid-row:1">시간</div>
          ${days.map((day,index) => `<div class="grid-cell day-head" style="grid-column:${index+2};grid-row:1">${day}<small>${formatDate(weekDates[day])}</small></div>`).join('')}
          ${hours.map((hour,row) => `<div class="grid-cell time-cell ${hour === '13:00' ? 'lunch-cell' : ''}" style="grid-column:1;grid-row:${row+2}">${hour}</div>${days.map((day,col) => `<div class="grid-cell ${hour === '13:00' ? 'lunch-cell' : ''}" style="grid-column:${col+2};grid-row:${row+2}"></div>`).join('')}`).join('')}
          ${days.map((day,index) => holidays.has(weekDates[day]) ? `<div class="holiday-column" style="grid-column:${index+2};grid-row:2 / span 9"><span>추석</span></div>` : '').join('')}
          ${weekSlots.map(({course,slot}) => {
            const col = days.indexOf(slot.day)+2;
            const row = hours.indexOf(slot.time)+2;
            const color = course.isLab ? 'var(--violet)' : (course.domain === '기초의학' ? 'var(--basic)' : 'var(--clinical)');
            const soft = course.isLab ? '#eeeafb' : (course.domain === '기초의학' ? 'var(--basic-soft)' : 'var(--clinical-soft)');
            const span = slot.duration || 1;
            const opImage = renderScheduleOp(course);
            return `<div class="course-slot" style="grid-column:${col};grid-row:${row} / span ${span};--course-color:${color};--course-soft:${soft}"><button class="course-card" type="button" data-course="${course.id}" aria-label="${course.id} ${course.title}, ${pathText(course)}"><span class="number">${course.id}${course.isLab ? ' · 실습' : ''}</span><span class="name">${course.title}</span><span class="teacher">${course.professor} 교수</span><span class="course-tooltip" role="tooltip">${pathText(course)}</span></button>${opImage}</div>`;
          }).join('')}
        </div></div></article>`;
      }).join('');
      target.querySelectorAll('[data-course]').forEach(button => button.addEventListener('click', () => showDetail(button.dataset.course, 'schedule')));
      syncScheduleOp();
    }

    function showView(name, updateHistory = true, scrollToTop = true) {
      closeQuestionExplanationSplit(false);
      document.body.classList.toggle('lecture-study-mode', name === 'detail');
      if (name !== 'detail') resetLectureStudyExpansion();
      document.querySelectorAll('.view').forEach(view => { view.hidden = view.id !== `${name}-view`; });
      document.body.classList.toggle('jbl-mode', name === 'jbl');
      document.querySelectorAll('#site-main-menu [data-go]').forEach(button => {
        if (button.dataset.go === name) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      setJblTopbarHidden(false);
      jblLastScrollY = 0;
      if (scrollToTop) window.scrollTo({top:0, behavior:'auto'});
      if (updateHistory) history.replaceState(null, '', name === 'catalog' ? '#catalog' : `#${name}`);
    }

    function showDetail(id, from = 'catalog', initialTab = '정리본', scrollToTop = true) {
      const course = byId(canonicalContentCourseId(id));
      if (!course) return;
      const orderedCourses = courses.slice().sort((a,b) => a.id - b.id);

    function wikiBookmarkSource(bookmark) {
      const course = byId(bookmark.courseId);

      const full = String(lectureNoteSources[bookmark.courseId] || '').replace(/\r\n?/g, '\n');
      const lines = full.split('\n');
      const headings = wikiHeadingRecordsFromLines(lines);
      // Never silently attach a bookmark to an unrelated section after editing.
      const exact = headings.find(item => item.slug === bookmark.slug && item.heading === bookmark.heading);

      const start = exact || (sameName.length === 1 ? sameName[0] : null);
      if (!start) return null;

        dialog.innerHTML = `<div class="anki-dialog-head"><div>${ankiButton('즐겨찾기 불러오기','favorites')}</div><h3>${editing ? '카드 편집' : '카드 작성'}</h3><button type="button" class="anki-close" data-anki-close aria-label="닫기">×</button></div><div class="anki-fields"><div><label for="anki-front">문제</label><textarea id="anki-front" data-anki-front spellcheck="false">${escapeHtml(card?.front || '')}</textarea></div><div><label for="anki-back">답</label><textarea id="anki-back" data-anki-back spellcheck="false">${escapeHtml(card?.back || '')}</textarea></div></div><p class="anki-status">${editing ? '수정 시 자동 저장됩니다.' : ''}</p>${wikiSyntaxHelpMarkup()}<div class="anki-actions">${editing ? `${ankiButton('←','previous')}${ankiButton('편집 종료','done')}${ankiButton('→','next')}` : `${ankiButton('취소','cancel')}${ankiButton('저장','save')}`}</div>`;
        const front = dialog.querySelector('[data-anki-front]');
        const back = dialog.querySelector('[data-anki-back]');
        [front,back].forEach(input => input.addEventListener('input', () => {
          if (!currentId) return;
          clearTimeout(timer);
          dialog.querySelector('.anki-status').textContent = '저장 중…';
          timer = setTimeout(persist,250);
        }));
        dialog.querySelector('[data-anki-action="favorites"]').onclick = () => openAnkiFavorites(course, source => {
          // Insert at the cursor; creating a card with no existing text simply fills its question.
          const start = front.selectionStart;
          const prefix = start > 0 ? '\n\n' : '';
          front.setRangeText(prefix + source, start, front.selectionEnd, 'end');
          front.dispatchEvent(new Event('input',{ bubbles:true }));
        });
        dialog.querySelector('[data-anki-close]').onclick = closeEditor;
        dialog.querySelector('[data-anki-action="cancel"]')?.addEventListener('click', () => dialog.close());
        dialog.querySelector('[data-anki-action="save"]')?.addEventListener('click', () => {
          if (!front.value.trim()) { front.focus(); dialog.querySelector('.anki-status').textContent = '문제를 입력해 주세요.'; return; }
          const next = [...ankiCards, { id:crypto.randomUUID(), courseId:ankiCourseId(course), front:front.value, back:back.value, updatedAt:Date.now() }];
          if (writeStudyStorage(ankiStorageKey,next)) { ankiCards = next; dialog.close(); }
        });
        dialog.querySelector('[data-anki-action="done"]')?.addEventListener('click', () => {
          if (!persist()) return;
          ankiEditingCourses.delete(ankiCourseId(course)); dialog.close();
        });
        ['previous','next'].forEach(action => {
          const button = dialog.querySelector(`[data-anki-action="${action}"]`);
          if (!button) return;
          const deck = ankiDeck(course);
          const nextIndex = deck.findIndex(item => item.id === currentId) + (action === 'next' ? 1 : -1);
          button.disabled = nextIndex < 0 || nextIndex >= deck.length;
          button.onclick = () => { if (persist()) { currentId = deck[nextIndex].id; draw(); dialog.scrollTo({top:0,behavior:'instant'}); } };
        });
      }
      draw();
      dialog.addEventListener('anki-flush', event => { if (!persist()) event.preventDefault(); });
      dialog.addEventListener('cancel', event => { event.preventDefault(); closeEditor(); });
      const flushOnExit = () => { if (currentId && dialog.isConnected) persist(); };
      window.addEventListener('pagehide',flushOnExit);
      dialog.addEventListener('close', () => { clearTimeout(timer); window.removeEventListener('pagehide',flushOnExit); refreshAnki(course); });
      if (loadFavorites) dialog.querySelector('[data-anki-action="favorites"]').click();
    }

    function openAnkiFavorites(course, add) {
      const dialog = makeAnkiDialog('즐겨찾기 불러오기');
      let tab = 'wiki';
      function draw() {
        const entries = tab === 'wiki'
          ? wikiBookmarks.map(item => ({ label:`${item.courseId}강 · ${item.heading}`, href:`#lecture-${item.courseId}`, source:() => wikiBookmarkSource(item), course:byId(item.courseId) || course }))
          : jblQuestions.filter(question => jblFavorites.has(question.id)).map(question => ({ label:`${question.globalNumber}번`, href:`#jbl-q-${question.globalNumber}`, source:() => ankiQuestionSource(question), course:byId(question.lectureIds?.[0]) || course, question }));
        dialog.innerHTML = `<div class="anki-dialog-head"><div role="tablist" aria-label="즐겨찾기 종류"><button type="button" class="content-tab ${tab==='wiki'?'active':''}" role="tab" aria-selected="${tab==='wiki'}" data-fav-tab="wiki">Wiki</button><button type="button" class="content-tab ${tab==='j'?'active':''}" role="tab" aria-selected="${tab==='j'}" data-fav-tab="j">J</button></div><button class="anki-close" type="button" data-close-favs aria-label="즐겨찾기 닫기">×</button></div><div class="anki-fav-layout"><div class="anki-fav-list">${entries.map((entry,index) => `<div class="anki-fav-row"><a href="${entry.href}" data-fav-preview="${index}">${escapeHtml(entry.label)}</a><button class="jbl-btn jbl-btn-sub" type="button" data-fav-add="${index}">추가</button></div>`).join('') || '<p>즐겨찾기한 항목이 없습니다.</p>'}</div><aside class="anki-preview" hidden></aside></div>`;
        dialog.querySelector('[data-close-favs]').onclick = () => dialog.close();
        dialog.querySelectorAll('[data-fav-tab]').forEach(button => button.onclick = () => { tab = button.dataset.favTab; draw(); });
        dialog.querySelectorAll('[data-fav-add]').forEach(button => button.onclick = () => {
          const source = entries[Number(button.dataset.favAdd)].source();
          if (source == null) { alert('문단이 이동하거나 제목이 바뀌었습니다. Wiki에서 다시 즐겨찾기해 주세요.'); return; }
          add(source, entries[Number(button.dataset.favAdd)]); dialog.close();
        });
        dialog.querySelectorAll('[data-fav-preview]').forEach(link => link.onclick = event => {
          event.preventDefault();
          const entry = entries[Number(link.dataset.favPreview)];
          const source = entry.source();
          const preview = dialog.querySelector('.anki-preview');
          dialog.querySelector('.anki-fav-layout').classList.add('with-preview');
          preview.hidden = false;
          preview.innerHTML = `<div class="anki-preview-head"><strong>${escapeHtml(entry.label)}</strong><button class="anki-close" type="button" data-close-preview aria-label="미리보기 닫기">×</button></div><div data-preview-body>${source == null ? '<p>문단을 찾을 수 없습니다. 다시 즐겨찾기해 주세요.</p>' : renderAnkiFragment(source,entry.course)}</div>${entry.question ? `<details><summary>정답 및 해설</summary><div data-preview-answer>${renderAnkiFragment(entry.question.answerLabel+'\n\n'+entry.question.explanation,entry.course)}</div></details>` : ''}`;
          bindAnkiFragment(preview.querySelector('[data-preview-body]'),entry.course);
          const answer = preview.querySelector('[data-preview-answer]');
          if (answer) bindAnkiFragment(answer,entry.course);
          preview.querySelector('[data-close-preview]').onclick = () => { preview.hidden = true; preview.replaceChildren(); dialog.querySelector('.anki-fav-layout').classList.remove('with-preview'); link.focus(); };
          preview.scrollTop = 0;
        });
      }
      draw();
    }

    const personalNoteState = { mode:'list', selectedId:null, draftId:null };
    const personalRenderCourseId = 990001;

    function personalNoteById(id) {
      return personalNotes.find(note => note.id === id) || null;
    }

    function personalNoteDate(value) {
      if (!value) return '';
      try { return new Intl.DateTimeFormat('ko-KR', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }).format(new Date(value)); }
      catch (_) { return ''; }
    }

    function cleanPersonalDocumentBody(source) {
      // The title has its own field, so a pasted top-level Wiki title cannot replace it.
      return String(source || '').replace(/^=\s+.+?\s+=$/gm, '').trim();
    }

    function personalDocumentWikiSource(note) {
      const safeTitle = String(note?.title || '제목 없는 문서').replace(/[\r\n=]+/g, ' ').trim() || '제목 없는 문서';
      const body = cleanPersonalDocumentBody(note?.source || '');
      return `= ${safeTitle} =${body ? `\n\n${body}` : ''}`;
    }

    function personalFavoriteSource(source, entry) {
      if (!entry?.question) return String(source || '').trim();
      const question = entry.question;
      return [
        `=== ${question.globalNumber}번 문항 ===`,
        question.question,
        question.passage,
        ...(question.images || []).map(path => `[[파일:${path.replace(/^\.\//, '')}|문항 이미지]]`),
        ...(question.choices || []).map(choice => `# ${choice}`)
      ].filter(Boolean).join('\n\n');
    }

    function personalToolbarMarkup(note = null, editing = false) {
      let actions = '';
      if (editing) {
        actions = '<button class="jbl-btn jbl-btn-sub" type="button" data-personal-action="favorites">즐겨찾기 불러오기</button>';
      } else if (note) {
        actions = '<button class="jbl-btn jbl-btn-sub" type="button" data-personal-action="list">목록</button><button class="jbl-btn jbl-btn-sub" type="button" data-personal-action="print">PDF 출력하기</button><button class="jbl-btn jbl-btn-sub" type="button" data-personal-action="export">저장하기</button><button class="jbl-btn jbl-btn-primary" type="button" data-personal-action="edit">편집하기</button>';
      } else {
        actions = `${personalNotes.length ? '<button class="jbl-btn jbl-btn-sub" type="button" data-personal-action="export">저장하기</button>' : ''}<button class="jbl-btn jbl-btn-primary" type="button" data-personal-action="new">새 문서</button>`;
      }
      return `<div class="personal-notes-toolbar"><h2 id="personal-notes-title">나만의 정리</h2>${actions}</div>`;
    }

    function bindPersonalToolbar(root, note = null, editing = false) {
      root.querySelector('[data-personal-action="list"]')?.addEventListener('click', () => renderPersonalNotes('list'));
      root.querySelector('[data-personal-action="new"]')?.addEventListener('click', () => renderPersonalEditor(null));
      root.querySelector('[data-personal-action="edit"]')?.addEventListener('click', () => note && renderPersonalEditor(note.id));
      root.querySelector('[data-personal-action="print"]')?.addEventListener('click', () => note && printPersonalDocument());
      root.querySelector('[data-personal-action="export"]')?.addEventListener('click', openPersonalExportDialog);
      root.querySelector('[data-personal-action="favorites"]')?.addEventListener('click', () => {
        if (editing) openPersonalFavoritesIntoEditor(root);
        else if (note) renderPersonalEditor(note.id, true);
      });
    }

    function renderPersonalNotes(mode = 'list', selectedId = null) {
      const root = document.querySelector('#personal-notes-root');
      if (!root) return;
      personalNoteState.mode = mode;
      personalNoteState.selectedId = selectedId;
      personalNoteState.draftId = null;
      if (mode === 'document') {
        const note = personalNoteById(selectedId);
        if (!note) return renderPersonalNotes('list');
        root.innerHTML = `${personalToolbarMarkup(note)}<p class="personal-document-meta">마지막 수정 ${escapeHtml(personalNoteDate(note.updatedAt))}</p><div class="personal-document-stage"><div class="personal-document-render" data-personal-document-render data-personal-course="${personalRenderCourseId}"></div></div>`;
        const fullSource = personalDocumentWikiSource(note);
        const renderCourse = { ...emptyRenderCourse, id:personalRenderCourseId, title:note.title, name:note.title };
        lectureNoteSources[personalRenderCourseId] = fullSource;
        const renderTarget = root.querySelector('[data-personal-document-render]');
        renderTarget.innerHTML = renderWikiDocument(fullSource, renderCourse);
        delete lectureNoteSources[personalRenderCourseId];
        bindWikiDocument(renderTarget, renderCourse);
        renderTarget.querySelectorAll('[data-wiki-edit], [data-wiki-section-edit], [data-wiki-heading-edit], .wiki-bookmark').forEach(element => element.remove());
        const personalToc = renderTarget.querySelector('.wiki-toc');
        if (personalToc && !personalToc.querySelector('.wiki-toc-link')) {
          personalToc.closest('.wiki-layout')?.classList.add('personal-without-toc');
          personalToc.remove();
        }
        bindPersonalToolbar(root, note, false);
        return;
      }

      const ordered = [...personalNotes].sort((a,b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));
      root.innerHTML = `${personalToolbarMarkup()}<div class="personal-notes-list">${ordered.length ? ordered.map(note => `<article class="personal-note-card"><button class="personal-note-open" type="button" data-personal-open="${escapeHtml(note.id)}"><strong>${escapeHtml(note.title || '제목 없는 문서')}</strong><span>${escapeHtml(personalNoteDate(note.updatedAt))}</span></button><button class="personal-note-delete" type="button" data-personal-delete="${escapeHtml(note.id)}">삭제</button></article>`).join('') : '<div class="personal-note-empty"><strong>아직 만든 문서가 없습니다.</strong><span>새 문서를 만들고 Wiki 또는 J 즐겨찾기를 불러와 정리해 보세요.</span></div>'}</div>`;
      bindPersonalToolbar(root);
      root.querySelectorAll('[data-personal-open]').forEach(button => button.addEventListener('click', () => renderPersonalNotes('document', button.dataset.personalOpen)));
      root.querySelectorAll('[data-personal-delete]').forEach(button => button.addEventListener('click', () => {
        const note = personalNoteById(button.dataset.personalDelete);
        if (!note || !confirm(`“${note.title || '제목 없는 문서'}” 문서를 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
        const next = personalNotes.filter(item => item.id !== note.id);
        if (writeStudyStorage(personalNotesStorageKey, next)) { personalNotes = next; renderPersonalNotes('list'); }
      }));
    }

    // Shared sources stay bundled; browser edits are stored separately from personal notes.
    const themeWikiRenderCourseId = 990002;
    const themeWikiEditsStorageKey = 'respiratory-theme-wiki-edits-v1';
    const themeWikiBaseDocuments = (() => {
      try {
        const payload = window.THEME_WIKI_DATA || {};
        const seen = new Set();
        return (Array.isArray(payload.documents) ? payload.documents : []).filter(note => {
          if (!note || typeof note.id !== 'string' || typeof note.title !== 'string' || typeof note.source !== 'string' || seen.has(note.id)) return false;
          seen.add(note.id);
          return true;
        });
      } catch (_) { return []; }
    })();
    let themeWikiEdits = readStudyStorage(themeWikiEditsStorageKey, []);
    if (!Array.isArray(themeWikiEdits)) themeWikiEdits = [];
    themeWikiEdits = themeWikiEdits.filter(note => note && typeof note.id === 'string' && typeof note.title === 'string' && typeof note.source === 'string' && themeWikiBaseDocuments.some(base => base.id === note.id));
    function currentThemeWikiDocuments() {
      return themeWikiBaseDocuments.map(base => ({ ...base, ...themeWikiEdits.find(edit => edit.id === base.id && (!base.revision || edit.baseRevision === base.revision)) }));
    }

    function renderThemeWikiEditor(id) {
      const root = document.querySelector('#theme-wiki-root');
      const note = currentThemeWikiDocuments().find(item => item.id === id);
      if (!root || !note) return;
      root.innerHTML = `<header class="personal-notes-toolbar"><h2 id="theme-wiki-title">테마별 정리 WIKI</h2><button type="button" class="jbl-btn jbl-btn-sub" data-theme-wiki-favorites>즐겨찾기 불러오기</button></header><section class="personal-document-editor"><div class="personal-document-title-field"><label for="theme-document-title">문서 제목</label><input id="theme-document-title" type="text" data-personal-title value="${escapeHtml(note.title)}" maxlength="120" autocomplete="off"></div><textarea class="wiki-source-editor" data-personal-source spellcheck="false">${escapeHtml(note.source)}</textarea>${wikiSyntaxHelpMarkup()}<p class="anki-status" data-personal-status></p><div class="personal-document-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-theme-wiki-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-theme-wiki-save>저장하기</button></div></section>`;
      root.querySelector('[data-theme-wiki-favorites]').onclick = () => openPersonalFavoritesIntoEditor(root);
      root.querySelector('[data-theme-wiki-cancel]').onclick = () => renderThemeWiki(id);
      root.querySelector('[data-theme-wiki-save]').onclick = () => {
        const titleInput = root.querySelector('[data-personal-title]');
        const title = titleInput.value.trim();
        if (!title) { root.querySelector('[data-personal-status]').textContent = '문서 제목을 입력해 주세요.'; titleInput.focus(); return; }
        const saved = { id:note.id, title, source:root.querySelector('[data-personal-source]').value, updatedAt:Date.now(), baseRevision:themeWikiBaseDocuments.find(base => base.id === note.id)?.revision };
        const next = [...themeWikiEdits.filter(item => item.id !== id), saved];
        if (!writeStudyStorage(themeWikiEditsStorageKey, next)) return;
        themeWikiEdits = next;
        renderThemeWiki(id);
      };
      root.querySelector('[data-personal-title]').focus();
    }

    function openThemeWikiExportDialog() {
      openDocumentExportDialog(currentThemeWikiDocuments(), '테마별 정리 WIKI 저장', '테마별-정리-Wiki');
    }

    function renderThemeWiki(selectedId = null) {
      const root = document.querySelector('#theme-wiki-root');
      if (!root) return;
      const themeWikiDocuments = currentThemeWikiDocuments();
      const note = themeWikiDocuments.find(item => item.id === selectedId);
      root.innerHTML = `<header class="personal-notes-toolbar"><h2 id="theme-wiki-title">테마별 정리 WIKI</h2>${note ? '<button type="button" class="jbl-btn jbl-btn-sub" data-theme-wiki-list>목록</button>' : ''}${themeWikiDocuments.length ? '<button type="button" class="jbl-btn jbl-btn-sub" data-theme-wiki-export>저장하기</button>' : ''}${note ? '<button type="button" class="jbl-btn jbl-btn-sub" data-theme-wiki-edit>편집하기</button>' : ''}<button type="button" class="jbl-btn jbl-btn-sub" data-theme-wiki-home>홈으로</button></header>`;
      root.querySelector('[data-theme-wiki-home]').onclick = () => quickNavigate('#home');
      root.querySelector('[data-theme-wiki-list]')?.addEventListener('click', () => quickNavigate('#theme-wiki'));
      root.querySelector('[data-theme-wiki-export]')?.addEventListener('click', openThemeWikiExportDialog);
      root.querySelector('[data-theme-wiki-edit]')?.addEventListener('click', () => renderThemeWikiEditor(note.id));
      if (!note) {
        const list = document.createElement('div');
        list.className = 'personal-notes-list theme-wiki-list';
        list.innerHTML = themeWikiDocuments.length ? themeWikiDocuments.map(item => `<article class="personal-note-card"><button type="button" class="personal-note-open" data-theme-wiki-document="${escapeHtml(item.id)}"><strong>${escapeHtml(item.title)}</strong></button></article>`).join('') : '<div class="personal-note-empty">등록된 문서가 없습니다.</div>';
        root.append(list);
        list.querySelectorAll('[data-theme-wiki-document]').forEach(button => {
          button.onclick = () => quickNavigate(`#theme-wiki/${encodeURIComponent(button.dataset.themeWikiDocument)}`);
        });
        return;
      }
      const stage = document.createElement('div');
      stage.className = 'personal-document-stage';
      const target = document.createElement('div');
      target.className = 'personal-document-render';
      target.dataset.personalDocumentRender = '';
      target.dataset.personalCourse = String(themeWikiRenderCourseId);
      stage.append(target);
      root.append(stage);
      const source = personalDocumentWikiSource(note);
      const course = { ...emptyRenderCourse, id:themeWikiRenderCourseId, title:note.title, name:note.title };
      // The renderer resolves relative headings against this temporary document context.
      const previousSource = lectureNoteSources[themeWikiRenderCourseId];
      try {
        lectureNoteSources[themeWikiRenderCourseId] = source;
        target.innerHTML = renderWikiDocument(source, course);
      } finally {
        if (previousSource === undefined) delete lectureNoteSources[themeWikiRenderCourseId];
        else lectureNoteSources[themeWikiRenderCourseId] = previousSource;
      }
      bindWikiDocument(target, course);
      target.querySelectorAll('[data-wiki-edit], [data-wiki-section-edit], [data-wiki-heading-edit], .wiki-bookmark').forEach(element => element.remove());
      const toc = target.querySelector('.wiki-toc');
      if (toc && !toc.querySelector('.wiki-toc-link')) {
        toc.closest('.wiki-layout')?.classList.add('personal-without-toc');
        toc.remove();
      }
    }

    function insertPersonalEditorSource(root, source) {
      const editor = root.querySelector('[data-personal-source]');
      if (!editor) return;
      const start = editor.selectionStart;
      const addition = String(source || '').trim();
      const prefix = start > 0 && editor.value.slice(0,start).trim() ? '\n\n' : '';
      editor.setRangeText(prefix + addition, start, editor.selectionEnd, 'end');
      editor.focus();
      editor.dispatchEvent(new Event('input', { bubbles:true }));
    }

    function openPersonalFavoritesIntoEditor(root) {
      const fallbackCourse = emptyRenderCourse;
      openAnkiFavorites(fallbackCourse, (source, entry) => insertPersonalEditorSource(root, personalFavoriteSource(source, entry)));
    }

    function renderPersonalEditor(id = null, loadFavorites = false) {
      const root = document.querySelector('#personal-notes-root');
      if (!root) return;
      const note = id ? personalNoteById(id) : null;
      personalNoteState.mode = 'editor';
      personalNoteState.selectedId = note?.id || null;
      personalNoteState.draftId = note?.id || null;
      root.innerHTML = `${personalToolbarMarkup(note, true)}<section class="personal-document-editor"><div class="personal-document-title-field"><label for="personal-document-title">문서 제목</label><input id="personal-document-title" type="text" data-personal-title value="${escapeHtml(note?.title || '')}" maxlength="120" autocomplete="off" placeholder="문서 제목을 입력하세요"></div><textarea class="wiki-source-editor" data-personal-source spellcheck="false" placeholder="Wiki 문법으로 내용을 작성하세요.">${escapeHtml(note?.source || '')}</textarea>${wikiSyntaxHelpMarkup()}<p class="anki-status" data-personal-status></p><div class="personal-document-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-personal-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-personal-save>저장하기</button></div></section>`;
      bindPersonalToolbar(root, note, true);
      const openFavorites = () => openPersonalFavoritesIntoEditor(root);
      root.querySelector('[data-personal-cancel]').addEventListener('click', () => note ? renderPersonalNotes('document', note.id) : renderPersonalNotes('list'));
      root.querySelector('[data-personal-save]').addEventListener('click', () => {
        const titleInput = root.querySelector('[data-personal-title]');
        const sourceInput = root.querySelector('[data-personal-source]');
        const title = titleInput.value.trim();
        if (!title) { root.querySelector('[data-personal-status]').textContent = '문서 제목을 입력해 주세요.'; titleInput.focus(); return; }
        const saved = { id:note?.id || (crypto.randomUUID ? crypto.randomUUID() : `personal-${Date.now()}`), title, source:sourceInput.value, updatedAt:Date.now() };
        const next = note ? personalNotes.map(item => item.id === note.id ? saved : item) : [...personalNotes, saved];
        if (!writeStudyStorage(personalNotesStorageKey, next)) return;
        personalNotes = next;
        renderPersonalNotes('document', saved.id);
      });
      if (loadFavorites) openFavorites();
      else root.querySelector('[data-personal-title]').focus();
    }

    function openPersonalExportDialog() {
      openDocumentExportDialog(personalNotes, '나만의 정리 저장', '나만의-정리');
    }

    function openDocumentExportDialog(notes, dialogTitle, filenamePrefix) {
      if (!notes.length) { alert('저장할 문서가 없습니다.'); return; }
      const dialog = makeAnkiDialog(dialogTitle);
      const ordered = [...notes].sort((a,b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));

      const count = dialog.querySelector('[data-personal-export-count]');
      const save = dialog.querySelector('[data-personal-export-save]');

        count.textContent = `${selected}개 선택`;

    async function printPersonalDocument() {
      const renderTarget = document.querySelector('#personal-notes-view:not([hidden]) [data-personal-document-render]');
      if (!renderTarget) { alert('먼저 출력할 문서를 열어 주세요.'); return; }
      document.body.classList.add('personal-printing');
      const cleanup = () => document.body.classList.remove('personal-printing');
      window.addEventListener('afterprint', cleanup, { once:true });
      try {
        if (document.fonts?.ready) await document.fonts.ready;
        await Promise.all([...renderTarget.querySelectorAll('img')].map(image => image.complete ? Promise.resolve() : new Promise(resolve => {
          image.addEventListener('load', resolve, { once:true });
          image.addEventListener('error', resolve, { once:true });
        })));
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.print();
      } catch (_) {
        cleanup();
        alert('인쇄 화면을 열지 못했습니다. 다시 시도해 주세요.');
      }
      window.setTimeout(cleanup, 60000);

        // Internal Wiki and J links open beside the current view instead of replacing it.
    const contextLinkState = {

    function validContextQuestionNumbers(numbers) {
      const available = new Set(jblQuestions.map(question => Number(question.globalNumber)));
      return [...new Set((Array.isArray(numbers) ? numbers : []).map(Number))]
        .filter(number => Number.isInteger(number) && number > 0 && available.has(number));

    function contextWikiQuestionSequence(link, questionNumber) {
      // Capture this document's rendered order, including collapsed sections and footnotes.
      // Do not collect from the whole page: the other split pane may contain a different Wiki.
      const wiki = link.closest('.wiki-note');
      if (wiki && !link.closest('.jbl-card')) {
        const numbers = validContextQuestionNumbers([...wiki.querySelectorAll('[data-jbl-question-link]')]
          .filter(item => item.closest('.wiki-note') === wiki)
          .map(item => item.dataset.jblQuestionLink));
        if (!numbers.includes(questionNumber)) return null;
        return { courseId:wiki.dataset.wikiDocumentCourse || '', title:wiki.querySelector('h3')?.textContent.trim() || 'Wiki', numbers };
      }
      // A cross-reference within a linked J keeps the originating Wiki only if it belongs
      // to that Wiki's sequence. Preview history still restores the original context.
      const current = contextLinkState.active ? contextLinkState.stack.at(-1) : null;
      if (questionExplanationState.active && link.closest('[data-explanation-body]')
          && questionExplanationState.viewer.key.startsWith('context-link-question-')
          && current?.wikiSequence?.numbers.includes(questionNumber)) return current.wikiSequence;
      if (link.closest('[data-context-link-body]') === contextLinkState.body && current?.type === 'j'
          && current.wikiSequence?.numbers.includes(questionNumber)) return current.wikiSequence;

    function contextQuestionPosition(target) {

    function contextQuestionIsEditing(target) {
      const question = target?.type === 'j' && jblQuestions.find(item => item.globalNumber === Number(target.questionNumber));

    }

    function updateContextQuestionNav(target) {
      const nav = contextLinkState.nav;
      if (!nav) return;
      const { numbers, index } = contextQuestionPosition(target);
      nav.hidden = index < 0;
      if (nav.hidden) { nav.innerHTML = ''; return; }
      const questions = numbers.map(number => jblQuestions.find(question => Number(question.globalNumber) === number));
      const state = viewerState(`context-link-question-${questions[index].id}`);

    function moveContextWikiQuestion(direction) {
      if (!contextLinkState.active || ![-1, 1].includes(direction)) return false;
      const target = contextLinkState.stack.at(-1);
      const { numbers, index } = contextQuestionPosition(target);
      const next = index + direction;
      if (index < 0 || next < 0 || next >= numbers.length || contextQuestionIsEditing(target)) return false;
      const focusInNav = contextLinkState.nav?.contains(document.activeElement);
      showContextLinkTarget({ ...target, questionNumber:numbers[next] }, true);
      // Only the right/bottom pane resets to the new question; the source Wiki stays put.
      if (focusInNav) {
        const action = direction > 0 ? 'next' : 'prev';
        const button = contextLinkState.nav.querySelector(`[data-context-question-${action}]:not(:disabled)`)
          || contextLinkState.nav.querySelector('button:not(:disabled)');
