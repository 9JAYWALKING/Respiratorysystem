    function handleContextQuestionShortcut(event) {
      if (event.defaultPrevented || event.repeat || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (document.querySelector('dialog[open], .wiki-section-editor-overlay, #jbl-image-modal.show')) return;
      if (event.target instanceof Element) {
        if (event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
        const control = event.target.closest('button, a');
        if (control && !control.closest('[data-context-link-nav]')) return;
      }
      const target = contextLinkState.stack.at(-1);
      if (target?.type !== 'j' || contextQuestionIsEditing(target)) return;
      if (event.code === 'Space') {
        event.preventDefault();
        contextLinkState.nav.querySelector('[data-jbl-explanation]')?.click();
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        moveContextWikiQuestion(event.key === 'ArrowRight' ? 1 : -1);
      }
    }

    function contextLinkTargetFromElement(link) {
      if (link.hasAttribute('data-jbl-question-link')) {
        const questionNumber = Number(link.dataset.jblQuestionLink);
        return Number.isFinite(questionNumber) ? { type:'j', questionNumber, wikiSequence:contextWikiQuestionSequence(link, questionNumber) } : null;
      }
      if (link.hasAttribute('data-wiki-course')) {
        const courseId = Number(link.dataset.wikiCourse);
        if (!Number.isFinite(courseId)) return null;
        return { type:'wiki', courseId:Number(canonicalContentCourseId(courseId)), section:link.dataset.wikiSection || '' };
      }
      return null;
    }

    function contextLinkTargetKey(target) {
      return target.type === 'j'
        ? `j:${target.questionNumber}:${JSON.stringify(target.wikiSequence || null)}`
        : `wiki:${target.courseId}:${target.section || ''}`;
    }

    function contextSourceScrollElement() {
      const source = contextLinkState.source;
      if (contextLinkState.returnPosition) return source;
      // All views remain mounted: a hidden question bank is not the current scroller.
      return source?.querySelector('#jbl-view:not([hidden]) #jbl-standalone .jbl-wrap') || source;
    }

    function captureContextWikiPosition(shell, opener) {
      if (!opener?.closest('.wiki-note') || !shell.contains(opener)) return null;
      // Splitting changes both the document width and the scroll containers.
      // Keep the original reading position, not the split pane's clamped offset.
      const elements = new Set();
      for (let element = opener.parentElement; element && shell.contains(element); element = element.parentElement) elements.add(element);
      shell.querySelectorAll('*').forEach(element => {
        if (element.scrollTop || element.scrollLeft) elements.add(element);
      });
      return { top:window.scrollY, left:window.scrollX || 0, hash:location.hash,
        anchor:captureContextWikiAnchor(opener.closest('.wiki-note'), shell),
        elements:[...elements].map(element => ({element, top:element.scrollTop || 0, left:element.scrollLeft || 0})) };
    }

    function captureContextWikiAnchor(note, shell) {
      let top = Math.max(0, document.querySelector('.masthead')?.getBoundingClientRect().bottom || 0);
      let bottom = window.innerHeight;
      for (let element = note.parentElement; element && shell.contains(element); element = element.parentElement) {
        const style = getComputedStyle(element);
        if (!/(auto|scroll|hidden|clip)/.test(style.overflowY || style.overflow)) continue;
        const rect = element.getBoundingClientRect();
        if (rect.height > 0) { top = Math.max(top, rect.top); bottom = Math.min(bottom, rect.bottom); }
      }
      if (bottom <= top) return null;
      let anchor = null;
      // Track the visible paragraph, not a page offset: text reflows in the narrower pane.
      for (const element of note.querySelectorAll('h3,h4,h5,h6,p,li,blockquote,figure,tr')) {
        if (!element.getClientRects?.().length) continue;
        const rect = element.getBoundingClientRect();
        if (rect.height <= 0 || rect.bottom <= top || rect.top >= bottom) continue;
        const coversTop = rect.top <= top;
        if (!anchor || (coversTop && !anchor.coversTop) ||
            (coversTop === anchor.coversTop && (coversTop ? rect.top > anchor.top : rect.top < anchor.top))) {
          anchor = {element, top:rect.top, offset:rect.top - top, coversTop};
        }
      }
      return anchor;
    }

    function alignContextWikiSource(position, source) {
      position.elements.forEach(({element, top, left}) => {
        if (!source.contains(element)) return;
        // Lecture Wiki uses only the outer source scroller while the split is open.
        element.scrollTop = element.matches('.lecture-pane-body') ? 0 : top;
        element.scrollLeft = left;
      });
      source.scrollTop = position.top;
      const anchor = position.anchor;
      if (anchor?.element.isConnected && source.contains(anchor.element)) {
        const top = source.getBoundingClientRect().top + (source.clientTop || 0);
        source.scrollTop += anchor.element.getBoundingClientRect().top - top - anchor.offset;
      }
    }

    function keepContextWikiPosition(position, source, split) {
      contextLinkState.positionCleanup?.();
      let stopped = false, scheduled = false, layoutChanged = false, lastScroll = source.scrollTop;
      const current = () => !stopped && contextLinkState.active && contextLinkState.split === split && !contextLinkState.expanded;
      const align = () => {
        if (!current()) return;
        alignContextWikiSource(position, source);
        lastScroll = source.scrollTop;
      };
      const schedule = (reflow = false) => {
        if (!current()) return;
        layoutChanged ||= reflow;
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          if (!current()) return;
          // Do not undo intentional scrolling between opening and the next frame.
          if (!layoutChanged && Math.abs(source.scrollTop - lastScroll) > 1) { stop(); return; }
          layoutChanged = false;
          align();

      const onKey = event => {
        if (['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(event.key)) stop();
      };

        if (stopped) return;
        stopped = true;

        for (const type of ['wheel','touchstart','pointerdown']) source.removeEventListener(type, stop, true);
        source.removeEventListener('keydown', onKey, true);
        source.removeEventListener('load', onLayout, true);
        source.removeEventListener('error', onLayout, true);
        window.removeEventListener('resize', onLayout);
        if (contextLinkState.positionCleanup === stop) contextLinkState.positionCleanup = null;
      };
      contextLinkState.positionCleanup = stop;
      source.setAttribute('data-context-positioning', '');

      // visible paragraph anchored until the reader deliberately interacts with it.
      for (const type of ['wheel','touchstart','pointerdown']) source.addEventListener(type, stop, {capture:true,passive:true});
      source.addEventListener('keydown', onKey, true);
      source.addEventListener('load', onLayout, true);
      source.addEventListener('error', onLayout, true);
      window.addEventListener('resize', onLayout);
      if (contextLinkState.shell) observer?.observe(contextLinkState.shell);
      observer?.observe(source);
      document.fonts?.ready.then(onLayout);
      align();
      schedule();

    function namespaceContextPreviewIds(container, token) {

    function toggleContextLinkExpanded() {

      contextLinkState.expand.addEventListener('click', toggleContextLinkExpanded);

        if (event.target.closest('button, a, input, textarea, select, [contenteditable]')) return;
        event.preventDefault();
        toggleContextLinkExpanded();
      });
      showContextLinkTarget(target, true);
      if (returnPosition) keepContextWikiPosition(returnPosition, source, split);
      else {
        const scroller = contextSourceScrollElement();
        scroller.scrollTop = contextLinkState.sourceScroll;
        const initialScroll = scroller.scrollTop;
        requestAnimationFrame(() => {
          if (contextLinkState.split === split && contextLinkState.active && !contextLinkState.expanded && scroller.scrollTop === initialScroll) {
            scroller.scrollTop = contextLinkState.sourceScroll;
          }
        });
      }
      window.PATHOLOGY_MAP?.refreshLayout?.();
    }

    function closeContextLinkSplit(restorePosition = true) {
      const positionRevision = ++contextLinkState.positionRevision;
      closeQuestionExplanationSplit(false);
      if (!contextLinkState.active) return;
      ++wikiNavigationToken;
      contextLinkState.positionCleanup?.();
      hideWikiFootnotePreview();
      const scroll = contextLinkState.expanded ? contextLinkState.sourcePaneScroll : contextSourceScrollElement()?.scrollTop || 0;
      const shell = contextLinkState.shell;
      const parent = contextLinkState.originalParent;
      const next = contextLinkState.originalNextSibling;
      const opener = contextLinkState.opener;
      const returnPosition = contextLinkState.returnPosition;
      if (shell && parent) {
        if (next && next.parentNode === parent) parent.insertBefore(shell, next);
        else parent.append(shell);
      }
      contextLinkState.split?.remove();
      document.body.classList.remove('context-link-open');
      Object.assign(contextLinkState, { active:false, expanded:false, split:null, source:null, target:null, body:null, title:null, back:null, nav:null, expand:null, shell:null, originalParent:null, originalNextSibling:null, sourceScroll:0, sourcePaneScroll:0, opener:null, stack:[], returnPosition:null, positionCleanup:null });
      document.dispatchEvent(new CustomEvent('context-link-visibility', { detail:{active:false} }));
      if (restorePosition) {
        const restore = () => {
          // An old close callback must never scroll a newly opened view or split.
          if (positionRevision !== contextLinkState.positionRevision || contextLinkState.active || !shell?.isConnected || shell.parentNode !== parent) return;
          if (returnPosition && location.hash !== returnPosition.hash) return;

          if (opener?.isConnected) opener.focus({ preventScroll:true });

        // Reapply after the full-width layout/scroll lock has settled on mobile.
        requestAnimationFrame(restore);
      }
    }

    function handleContextLinkClick(event) {
      if (event.defaultPrevented || event.button !== 0 || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;

      if (personalDocument && link.hasAttribute('data-wiki-course') && Number(link.dataset.wikiCourse) === Number(personalDocument.dataset.personalCourse)) return;
      const target = contextLinkTargetFromElement(link);
      if (!target) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (questionExplanationState.active) closeQuestionExplanationSplit(false);
      if (handleLectureStudyLink(link, target)) return;

    document.addEventListener('click', handleContextLinkClick, true);
    document.addEventListener('keydown', event => {
      if (questionExplanationState.active) return;
      if (event.key === 'Escape' && contextLinkState.active && !document.querySelector('dialog[open], .wiki-section-editor-overlay, #jbl-image-modal.show')) {
        event.preventDefault();
        closeContextLinkSplit();

    // Integrated Wiki and J search. The index is built lazily so the first page stays light.
    let globalSearchDialog = null;
    let globalSearchIndex = null;
    let globalSearchOpener = null;
    let globalSearchRestoreFocus = true;
    const globalSearchState = { query:'', terms:[], filter:'all', wiki:[], j:[] };

    function globalSearchPlainText(value) {
      return String(value ?? '')
        .replace(/\[\[파일:([^|\]]+)(?:\|([^\]]*))?\]\]/g, (_, file, options) => {
          const caption = String(options || '').split('|').filter(part => !/^(?:원본:|alt=|width=|height=)/i.test(part)).at(-1);
          return caption || file.replace(/[-_]/g, ' ');
        })
        .replace(/\[\[[^|\]]+\|([^\]]+)\]\]/g, '$1')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/\{\{(\d+)\}\}/g, '$1번')
        .replace(/^\s*@[a-z]+\s+/gim, '')
        .replace(/'''|''|""|~~~|~~/g, '')
        .replace(/^\s*=+\s*|\s*=+\s*$/gm, '')
        .replace(/\|\|/g, ' ')
        .replace(/<[^>]*>/g, ' ')
        .replace(/&(?:nbsp|amp|lt|gt|quot|#39);/g, token => ({ '&nbsp;':' ', '&amp;':'&', '&lt;':'<', '&gt;':'>', '&quot;':'"', '&#39;':"'" }[token] || ' '))
        .replace(/\s+/g, ' ')
        .trim();
    }

    const globalSearchNormalize = value => globalSearchPlainText(value).normalize('NFKC').toLocaleLowerCase('ko');
    const globalSearchTerms = query => globalSearchNormalize(query).split(/\s+/).filter(Boolean);
    const globalSearchMatches = (text, terms) => terms.length > 0 && terms.every(term => text.includes(term));
    const globalSearchEscapeRegExp = value => String(value).replace(/[.*+?^$\{\}()|[\]\\]/g, '\\$&');

    function globalSearchHighlight(value, terms) {
      const text = String(value || '');
      if (!terms.length) return escapeHtml(text);
      const pattern = new RegExp('(' + [...terms].sort((a,b) => b.length - a.length).map(globalSearchEscapeRegExp).join('|') + ')', 'giu');
      return text.split(pattern).map(part => terms.some(term => globalSearchNormalize(part) === term) ? '<mark>' + escapeHtml(part) + '</mark>' : escapeHtml(part)).join('');
    }

    function globalSearchSnippet(value, terms, maxLength = 190) {
      const text = globalSearchPlainText(value);
      if (!text) return '';
      const normalized = text.normalize('NFKC').toLocaleLowerCase('ko');
      const positions = terms.map(term => normalized.indexOf(term)).filter(position => position >= 0);
      const hit = positions.length ? Math.min(...positions) : 0;
      const start = Math.max(0, hit - Math.floor(maxLength * .28));
      const end = Math.min(text.length, start + maxLength);
      const excerpt = (start > 0 ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
      return globalSearchHighlight(excerpt, terms);
    }

    function buildGlobalWikiSearchIndex() {
      const items = [];
      const seenCourseIds = new Set();
      courses.forEach(rawCourse => {
        const course = byId(canonicalContentCourseId(rawCourse.id));
        if (!course || seenCourseIds.has(course.id)) return;
        seenCourseIds.add(course.id);
        const source = String(lectureNoteSources[course.id] || '').replace(/\r\n?/g, '\n');
        const courseLabel = contentCourseText(course);
        const metadata = [courseLabel, course.professor, pathText(course)].join(' ');
        if (source.trim()) {
          const lines = source.split('\n');
          const records = wikiSourceHeadingRecords(course);
          const firstLine = records[0]?.lineIndex ?? lines.length;
          const intro = globalSearchPlainText(lines.slice(0, firstLine).join('\n'));
          if (intro) items.push({ type:'wiki', courseId:course.id, slug:'', heading:'문서 개요', body:intro, metadata, courseLabel });
          records.forEach((record, index) => {
            const end = records[index + 1]?.lineIndex ?? lines.length;
            items.push({
              type:'wiki', courseId:course.id, slug:record.slug, heading:globalSearchPlainText(record.heading),
              body:globalSearchPlainText(lines.slice(record.lineIndex + 1, end).join('\n')), metadata, courseLabel, level:record.level
            });
          });
          return;
        }
        const fallback = legacyLectureNotes[course.id];
        if (!fallback) return;
        const holder = document.createElement('div');
        holder.innerHTML = fallback;
        const sections = [...holder.querySelectorAll('.wiki-section')];
        if (!sections.length) {
          const body = globalSearchPlainText(holder.textContent);
          if (body) items.push({ type:'wiki', courseId:course.id, slug:'', heading:'문서', body, metadata, courseLabel });
          return;
        }
        sections.forEach((section, index) => {
          const heading = globalSearchPlainText(section.querySelector('h1,h2,h3,h4,h5,h6')?.textContent || '문단');
          items.push({ type:'wiki', courseId:course.id, slug:section.dataset.wikiSection || section.id?.replace(/^wiki-\d+-|^note-\d+-/, '') || 'section-' + (index + 1), heading, body:globalSearchPlainText(section.textContent), metadata, courseLabel });
        });
      });
      return items.map(item => ({ ...item, headingSearch:globalSearchNormalize(item.heading), bodySearch:globalSearchNormalize(item.body), metadataSearch:globalSearchNormalize(item.metadata) }));
    }

    function buildGlobalJSearchIndex() {
      return jblQuestions.map(question => {
        const course = byId(question.lectureId || question.lectureIds?.[0]);
        const questionText = globalSearchPlainText(question.question);
        const passage = globalSearchPlainText(question.passage);
        const choices = globalSearchPlainText((question.choices || []).map((choice, index) => (index + 1) + '번 ' + choice).join(' '));
        const explanation = globalSearchPlainText([question.answerLabel, question.explanation].filter(Boolean).join(' '));
        const metadata = globalSearchPlainText([question.globalNumber + '번', question.year, question.source, questionCourseText(question), questionExamProfessor(question)].filter(Boolean).join(' '));
        return {
          type:'j', globalNumber:question.globalNumber, question:questionText, passage, choices, explanation, metadata,
          questionSearch:globalSearchNormalize(questionText), passageSearch:globalSearchNormalize(passage), choicesSearch:globalSearchNormalize(choices), explanationSearch:globalSearchNormalize(explanation), metadataSearch:globalSearchNormalize(metadata)
        };
      });
    }

    function ensureGlobalSearchIndex() {
      if (!globalSearchIndex) globalSearchIndex = { wiki:buildGlobalWikiSearchIndex(), j:buildGlobalJSearchIndex() };
      return globalSearchIndex;
    }

    function runGlobalSearch(query) {
      const terms = globalSearchTerms(query);
      globalSearchState.query = String(query || '').trim();
      globalSearchState.terms = terms;
      if (!terms.length) { globalSearchState.wiki = []; globalSearchState.j = []; return; }
      globalSearchIndex = null; // Include Wiki/J edits made in the current browser session.
      const index = ensureGlobalSearchIndex();
      const fullQuery = terms.join(' ');
      globalSearchState.wiki = index.wiki.map(item => {
        const all = [item.headingSearch, item.bodySearch, item.metadataSearch].join(' ');
        if (!globalSearchMatches(all, terms)) return null;
        let score = item.level ? Math.max(0, item.level - 2) * 3 : 0;
        if (item.headingSearch.includes(fullQuery)) score += 80;
        if (item.metadataSearch.includes(fullQuery)) score += 32;
        terms.forEach(term => { if (item.headingSearch.includes(term)) score += 24; if (item.metadataSearch.includes(term)) score += 10; if (item.bodySearch.includes(term)) score += 5; });
        return { ...item, score };
      }).filter(Boolean).sort((a,b) => b.score - a.score || a.courseId - b.courseId || a.heading.localeCompare(b.heading, 'ko'));

      globalSearchState.j = index.j.map(item => {
        const all = [item.questionSearch, item.passageSearch, item.choicesSearch, item.explanationSearch, item.metadataSearch].join(' ');
        if (!globalSearchMatches(all, terms)) return null;
        let score = String(item.globalNumber) === fullQuery.replace(/번$/, '') ? 1000 : 0;
        if (item.questionSearch.includes(fullQuery)) score += 95;
        if (item.passageSearch.includes(fullQuery)) score += 52;
        if (item.choicesSearch.includes(fullQuery)) score += 42;
        if (item.metadataSearch.includes(fullQuery)) score += 34;
        if (item.explanationSearch.includes(fullQuery)) score += 16;
        terms.forEach(term => { if (item.questionSearch.includes(term)) score += 26; if (item.passageSearch.includes(term)) score += 16; if (item.choicesSearch.includes(term)) score += 13; if (item.metadataSearch.includes(term)) score += 10; if (item.explanationSearch.includes(term)) score += 4; });
        return { ...item, score };
      }).filter(Boolean).sort((a,b) => b.score - a.score || a.globalNumber - b.globalNumber);
    }

    function globalSearchJSnippet(item) {
      const fields = [
        ['발문', item.question, item.questionSearch], ['제시문', item.passage, item.passageSearch], ['선지', item.choices, item.choicesSearch], ['해설', item.explanation, item.explanationSearch]
      ];
      const picked = fields.find(([, , normalized]) => globalSearchMatches(normalized, globalSearchState.terms)) || fields.find(([, text]) => text) || ['', '', ''];
      return (picked[0] ? '<strong>' + picked[0] + '</strong> · ' : '') + globalSearchSnippet(picked[1], globalSearchState.terms);
    }

    function renderGlobalSearchGroup(type, items, total) {
      const label = type === 'wiki' ? 'Wiki' : 'J';
      const visible = items.slice(0, 80);
      if (!visible.length) return '';
      const rows = visible.map(item => {
        if (type === 'wiki') {
          return '<button class="global-search-result" type="button" role="listitem" data-search-type="wiki" data-search-course="' + item.courseId + '" data-search-section="' + escapeHtml(item.slug) + '"><span class="global-search-kind">Wiki</span><span class="global-search-result-copy"><span class="global-search-result-title">' + globalSearchHighlight(item.courseLabel + ' · ' + item.heading, globalSearchState.terms) + '</span><span class="global-search-result-meta">' + escapeHtml(item.metadata) + '</span><span class="global-search-result-snippet">' + globalSearchSnippet(item.body || item.heading, globalSearchState.terms) + '</span></span></button>';
        }
        return '<button class="global-search-result" type="button" role="listitem" data-search-type="j" data-search-question="' + item.globalNumber + '"><span class="global-search-kind j">J</span><span class="global-search-result-copy"><span class="global-search-result-title">' + globalSearchHighlight(item.globalNumber + '번 · ' + item.question, globalSearchState.terms) + '</span><span class="global-search-result-meta">' + escapeHtml(item.metadata) + '</span><span class="global-search-result-snippet">' + globalSearchJSnippet(item) + '</span></span></button>';
      }).join('');
      return '<section class="global-search-group" aria-label="' + label + ' 검색 결과"><h3 class="global-search-group-head"><span>' + label + '</span><small>' + total.toLocaleString('ko-KR') + '개' + (total > visible.length ? ' · 상위 ' + visible.length + '개 표시' : '') + '</small></h3><div class="global-search-list" role="list">' + rows + '</div></section>';
    }

    function renderGlobalSearchResults() {
      if (!globalSearchDialog) return;
      const summary = globalSearchDialog.querySelector('[data-search-summary]');
      const results = globalSearchDialog.querySelector('[data-search-results]');
      const tabs = globalSearchDialog.querySelector('[data-search-tabs]');
      const counts = { all:globalSearchState.wiki.length + globalSearchState.j.length, wiki:globalSearchState.wiki.length, j:globalSearchState.j.length };
      tabs.innerHTML = [['all','전체'],['wiki','Wiki'],['j','J']].map(([key,label]) => '<button class="global-search-tab" type="button" role="tab" aria-selected="' + (globalSearchState.filter === key) + '" data-search-filter="' + key + '">' + label + ' ' + counts[key].toLocaleString('ko-KR') + '</button>').join('');
      if (!globalSearchState.terms.length) {
        summary.textContent = 'Wiki와 J의 발문·선지·해설을 함께 검색합니다.';
        results.innerHTML = '<p class="global-search-empty">찾고 싶은 의학 용어나 표현을 입력해 주세요.</p>';
        return;
      }
      summary.textContent = '“' + globalSearchState.query + '” 검색 결과 ' + counts.all.toLocaleString('ko-KR') + '개';
      const chunks = [];
      if (globalSearchState.filter !== 'j') chunks.push(renderGlobalSearchGroup('wiki', globalSearchState.wiki, counts.wiki));
      if (globalSearchState.filter !== 'wiki') chunks.push(renderGlobalSearchGroup('j', globalSearchState.j, counts.j));
      results.innerHTML = chunks.filter(Boolean).join('') || '<p class="global-search-empty">일치하는 결과가 없습니다.<br>띄어쓰기나 검색어를 바꾸어 보세요.</p>';
      results.scrollTop = 0;
    }

    function currentGlobalSearchView() {
      const view = [...document.querySelectorAll('.view')].find(element => !element.hidden);
      const name = view?.id?.replace(/-view$/, '') || 'catalog';
      return name === 'detail' ? previousView : name;
    }

    function openGlobalSearchWiki(courseId, section) {
      const course = byId(canonicalContentCourseId(courseId));
      if (!course) return;
      globalSearchRestoreFocus = false;
      globalSearchDialog?.close();
      showDetail(course.id, currentGlobalSearchView(), '정리본', !section);
      history.replaceState({ ...(history.state || {}), detailTab:'정리본', wikiSection:section || '' }, '', '#lecture-' + course.id);
      if (section) queueWikiSectionScroll(() => document.querySelector('#content-panel'), section);
    }

    function createGlobalSearchDialog() {
      if (globalSearchDialog) return globalSearchDialog;
      const dialog = document.createElement('dialog');
      dialog.className = 'global-search-dialog';
      dialog.setAttribute('aria-labelledby', 'global-search-title');
      dialog.innerHTML = '<header class="global-search-head"><h2 id="global-search-title">Wiki · J 통합검색</h2><button class="global-search-close" type="button" aria-label="검색창 닫기">×</button></header><form class="global-search-dialog-form" role="search" data-search-dialog-form><input class="global-search-dialog-input" type="search" data-search-dialog-input aria-label="통합검색어" autocomplete="off" spellcheck="false"><button class="global-search-dialog-run" type="submit">검색</button></form><div class="global-search-tabs" role="tablist" aria-label="검색 범위" data-search-tabs></div><p class="global-search-summary" role="status" aria-live="polite" data-search-summary></p><div class="global-search-results" data-search-results></div>';
      document.body.append(dialog);
      globalSearchDialog = dialog;
      dialog.querySelector('.global-search-close').addEventListener('click', () => dialog.close());
      dialog.querySelector('[data-search-dialog-form]').addEventListener('submit', event => {
        event.preventDefault();
        const input = dialog.querySelector('[data-search-dialog-input]');
        runGlobalSearch(input.value);
        const headerInput = document.querySelector('[data-global-search-input]');
        if (headerInput) headerInput.value = input.value;
        renderGlobalSearchResults();
      });
      dialog.querySelector('[data-search-tabs]').addEventListener('click', event => {
        const button = event.target.closest('[data-search-filter]');

        renderGlobalSearchResults();

      dialog.querySelector('[data-search-results]').addEventListener('click', event => {
        const result = event.target.closest('[data-search-type]');
        if (!result) return;
        if (result.dataset.searchType === 'wiki') return openGlobalSearchWiki(result.dataset.searchCourse, result.dataset.searchSection);
        globalSearchRestoreFocus = false;
        dialog.close();
        openJblQuestionNumber(result.dataset.searchQuestion);
      });
      dialog.addEventListener('click', event => {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      });
      dialog.addEventListener('close', () => {
        if (globalSearchRestoreFocus) globalSearchOpener?.focus?.();
        globalSearchRestoreFocus = true;
      });
      return dialog;
    }

    function openGlobalSearch(query, opener) {
      const dialog = createGlobalSearchDialog();
      globalSearchOpener = opener || document.querySelector('[data-global-search-input]');
      globalSearchState.filter = 'all';
      const input = dialog.querySelector('[data-search-dialog-input]');
      input.value = String(query || '');

      // Open first so a local-file runtime error can never look like a dead button.
      if (!dialog.open) {
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else dialog.setAttribute('open', '');
      }

      try {
        runGlobalSearch(query);
        renderGlobalSearchResults();
      } catch (error) {
        console.error('통합검색 실행 오류', error);
        const summary = dialog.querySelector('[data-search-summary]');
        const results = dialog.querySelector('[data-search-results]');
        if (summary) summary.textContent = '검색을 완료하지 못했습니다.';
        if (results) results.innerHTML = '<div class="global-search-empty"><strong>검색 데이터 로딩 오류</strong><span>페이지를 새로고침한 뒤 다시 시도해 주세요.</span></div>';
      }

      requestAnimationFrame(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); });
    }

    const globalSearchForm = document.querySelector('[data-global-search-form]');
    const globalSearchInput = globalSearchForm?.querySelector('[data-global-search-input]');
    const globalSearchSubmit = globalSearchForm?.querySelector('.global-search-submit');
    const submitGlobalSearch = event => {

    // Bind the magnifier itself as well as form submit for reliable file:// use.
    globalSearchSubmit?.addEventListener('click', submitGlobalSearch);

    const mainMenuToggle = document.querySelector('[data-main-menu-toggle]');
    const mainMenu = document.querySelector('#site-main-menu');

    function setMainMenuOpen(open) {
      if (document.body.classList.contains('study-ui')) { if(mainMenu) mainMenu.hidden = true; return; }

      mainMenu.hidden = !open;

    document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => {
      const destination = button.dataset.go;
      setMainMenuOpen(false);
      if (destination === 'catalog') { renderDomainTabs(); renderCatalog(); }
      if (destination === 'schedule') return showCurrentSchedule(true);
      if (destination === 'jbl') { prepareJblStart(false); renderJblStandalone(); }
      if (destination === 'home') return quickNavigate('#home');
      if (destination === 'personal-notes') renderPersonalNotes('list');
      showView(destination);
    }));

    window.addEventListener('hashchange', routeFromHash);
    function routeFromHash() {
      closeQuestionExplanationSplit(false);
      if (contextLinkState.active) closeContextLinkSplit(false);
      setMainMenuOpen(false);
      const hash = location.hash;
      const mapRoute = hash.match(/^#map(?:-([a-z]+))?$/);
      if (mapRoute) { renderDiseaseMap(mapRoute[1]); return showView('map', false); }
      const linkedQuestion = hash.match(/^#jbl-q-(\d+)$/);
      if (linkedQuestion) {
        const state = standaloneState();
        state.linkedQuestionNumber = Number(linkedQuestion[1]);
        state.index = jblQuestionsByNumber().findIndex(question => Number(question.globalNumber) === state.linkedQuestionNumber);
        renderJblStandalone();
        return showView('jbl', false);
      }
      if (hash.startsWith('#lecture-')) {
        const wikiSection = history.state?.wikiSection || '';
        showDetail(hash.replace('#lecture-',''), previousView, history.state?.detailTab || '정리본', !wikiSection);
        if (wikiSection) queueWikiSectionScroll(() => document.querySelector('#content-panel'), wikiSection);
        return;
      }
      if (!hash || hash === '#home') { renderQuickStart(); return showView('home', false); }
      const week = hash.match(/^#schedule-week-(\d+)$/);
      if (week) return showScheduleWeek(Number(week[1]));
      if (hash === '#jbl-wrong') { prepareJblStart(true); renderJblStandalone(); return showView('jbl', false); }
      const collection = hash.match(/^#bookmarks(?:-([a-z]+))?$/);
      if (collection) { renderBookmarkCollection(collection[1] || ''); return showView('bookmarks', false); }
      if (hash === '#schedule') return showCurrentSchedule();
      if (hash === '#jbl') { prepareJblStart(false); renderJblStandalone(); return showView('jbl', false); }
      const themeWikiRoute = hash.match(/^#theme-wiki(?:\/(.+))?$/);
      if (themeWikiRoute) {
        let selectedId = null;
        try { selectedId = themeWikiRoute[1] ? decodeURIComponent(themeWikiRoute[1]) : null; } catch (_) { /* Invalid URL opens the list. */ }
        renderThemeWiki(selectedId);
        return showView('theme-wiki', false);
      }
      if (hash === '#personal-notes') { renderPersonalNotes('list'); return showView('personal-notes', false); }
      renderQuickStart(); showView('home', false);
    }

    function activeQuestionViewer() {
      if (!document.querySelector('#jbl-view').hidden) {
        return { questions:currentStandaloneQuestions(), key:'jbl-all', rerender:renderJblStandalone };
      }
      if (!document.querySelector('#detail-view').hidden && document.querySelector('[data-course-j-host]')) {
        if (document.querySelector('[data-course-j-host]').closest('[hidden]')) return null;
        const match = location.hash.match(/^#lecture-(\d+)$/);
        const course = match ? byId(match[1]) : null;
        if (!course) return null;
        return {
          questions:lectureStudyViewerQuestions(course),
          key:lectureStudyViewerKey(course),
          rerender:() => renderCourseJ(course)
        };
      }
      return null;
    }

    function handleAnkiShortcut(event) {
      if (event.defaultPrevented || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      const card = document.querySelector('#detail-view:not([hidden]) [data-anki-study-card]');
      if (!card || activeDetailTab !== 'KMLE' || document.querySelector('dialog[open], .wiki-section-editor-overlay, #jbl-image-modal.show')) return;
      if (event.target instanceof Element) {
        if (event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
        const control = event.target.closest('button, a');
        if (control && !control.closest('.anki-study-footer')) return;
      }
      const action = event.code === 'Space' || event.key === ' ' ? 'flip' : event.key === ',' ? 'pass' : event.key === '.' ? 'know' : null;
      if (!action) return;
      event.preventDefault();
      if (!event.repeat) card.querySelector(`[data-anki-action="${action}"]`).click();
    }

    function handleQuestionShortcut(event) {
      if (document.querySelector('dialog[open]')) return;
      if (questionExplanationState.active) { handleQuestionExplanationShortcut(event); return; }
      if (contextLinkState.active) { handleContextQuestionShortcut(event); return; }
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, button, [contenteditable="true"]')) return;
      if (document.querySelector('#jbl-image-modal').classList.contains('show')) return;
      const viewer = activeQuestionViewer();
      if (!viewer || !viewer.questions.length) return;
      const state = viewerState(viewer.key);
      if (state.editing) return;
      const question = viewer.questions[state.index];
      if (!question) return;

      if (event.code === 'Space') {
        event.preventDefault();
        toggleQuestionExplanation(state, question, viewer.rerender);
        return;
      }

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        if (state.index <= 0) return;
        state.index -= 1;
        viewer.rerender();
        scrollCurrentQuestionToTop(viewer.key);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        if (state.index >= viewer.questions.length - 1) return;
        state.index += 1;
        viewer.rerender();
        scrollCurrentQuestionToTop(viewer.key);
      }
    }

    // Update information is plain text, never evaluated as HTML or Wiki markup.
    let informationDialog = null;
    function openInformationDialog(opener) {
      if (informationDialog?.open) return;
      const dialog = document.createElement('dialog');
      dialog.className = 'information-dialog';
      dialog.setAttribute('aria-labelledby', 'information-title');
      dialog.innerHTML = `<header class="information-head"><h2 id="information-title">업데이트 현황</h2><button type="button" class="information-close" aria-label="업데이트 현황 닫기" autofocus>×</button></header><div class="information-body"><p class="information-status" role="status" aria-live="polite"></p><div class="information-text" hidden></div><div class="information-fallback" hidden><button type="button" class="information-file-button" data-information-file>information.txt 선택</button><button type="button" class="information-file-button" data-information-retry>다시 읽기</button><input type="file" accept=".txt,text/plain" data-information-input hidden></div></div>`;
      const status = dialog.querySelector('.information-status');
      const content = dialog.querySelector('.information-text');
      const fallback = dialog.querySelector('.information-fallback');
      const input = dialog.querySelector('[data-information-input]');
      let controller = null, timer = null, generation = 0;
      function cancelLoad() {
        generation += 1;
        controller?.abort(); controller = null;
        clearTimeout(timer); timer = null;
      }
      function setStatus(message, selectable = false) {
        status.textContent = message; status.hidden = false;
        content.textContent = ''; content.hidden = true;
        fallback.hidden = !selectable;
        dialog.removeAttribute('aria-busy');
      }
      function showText(text) {
        content.textContent = text.replace(/^\uFEFF/, '');
        content.hidden = !content.textContent.trim();
        status.textContent = content.hidden ? '아직 등록된 업데이트 내용이 없습니다.' : '';
        status.hidden = !content.hidden; fallback.hidden = true;
        dialog.removeAttribute('aria-busy');
      }
      async function loadInformation() {
        cancelLoad(); const request = generation;
        setStatus('업데이트 내용을 읽는 중…');
        dialog.setAttribute('aria-busy','true');
        dialog.querySelector('[data-information-retry]').hidden = false;
        const activeController = new AbortController(); controller = activeController;
        timer = setTimeout(() => activeController.abort(), 10000);
        try {
          const url = new URL('./information.txt', location.href);
          const response = await fetch(url.href, {cache:'no-store',signal:activeController.signal});
          if (!response.ok) throw new Error(response.status === 404 ? 'missing' : 'load');
          const text = await response.text();
          if (request === generation && dialog.open) showText(text);
        } catch (error) {
          if (request !== generation || !dialog.open) return;
          const message = location.protocol === 'file:'
            ? '브라우저가 로컬 파일의 자동 읽기를 제한합니다. 같은 폴더의 information.txt를 선택해 주세요.'
            : error.message === 'missing'
              ? 'information.txt를 찾지 못했어요. index.html과 같은 폴더에 업로드해 주세요.'
              : '업데이트 내용을 불러오지 못했어요. 잠시 후 다시 읽기를 눌러 주세요.';
          setStatus(message,true);
        } finally {
          if (request === generation) { clearTimeout(timer);timer=null;controller=null; }
        }
      }
      
    dialog.querySelector('.information-close').addEventListener('click', () => dialog.close());
      dialog.querySelector('[data-information-file]').addEventListener('click', () => input.click());
      dialog.querySelector('[data-information-retry]').addEventListener('click', loadInformation);
      input.addEventListener('change', async () => {
        const file = input.files?.[0]; if (!file) return;
        cancelLoad(); const request = generation;
        if (file.name.toLowerCase() !== 'information.txt') { setStatus('information.txt 파일을 선택해 주세요.', true); input.value = ''; return; }
        setStatus('업데이트 내용을 읽는 중…');
        try { const text = await file.text(); if (request === generation && dialog.open) showText(text); }
        catch { if (request === generation && dialog.open) setStatus('파일을 읽지 못했어요. UTF-8로 저장된 TXT 파일인지 확인해 주세요.', true); }
        input.value = '';
      });
      // Native dialog handles Escape and focus trapping; keep quiz shortcuts inactive.
      dialog.addEventListener('keydown', event => event.stopPropagation());
      let backdropDown = false;
      const outside = event => { const r = dialog.getBoundingClientRect(); return event.target === dialog && (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom); };
      dialog.addEventListener('pointerdown', event => { backdropDown = outside(event); });
      dialog.addEventListener('click', event => { if (backdropDown && outside(event)) dialog.close(); backdropDown = false; });
      dialog.addEventListener('close', () => {
        cancelLoad(); dialog.remove();
        if (informationDialog === dialog) { informationDialog = null; document.body.classList.remove('information-open'); }
        if (opener?.isConnected) opener.focus({preventScroll:true});
      }, {once:true});
      document.body.append(dialog); informationDialog = dialog;
      dialog.showModal(); document.body.classList.add('information-open');
      loadInformation();
    }
    document.addEventListener('click', event => {
      const opener = event.target.closest?.('[data-information-open]');
      if (opener) {
        setMainMenuOpen(false);
        openInformationDialog(opener);
      }
    });

    document.querySelector('#jbl-image-modal').addEventListener('click', event => { if (event.target.id === 'jbl-image-modal') closeJblImage(); });
    document.querySelector('.jbl-image-close').addEventListener('click', closeJblImage);
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && document.querySelector('#jbl-image-modal.show')) { event.preventDefault(); closeJblImage(); } });
    document.addEventListener('keydown', handleQuestionShortcut);
    // Anki has no entry point or keyboard listener in the respiratory UI.
    window.addEventListener('scroll', handleJblTopbarScroll, { passive:true });
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 760px)').matches) setJblTopbarHidden(false);
      jblLastScrollY = Math.max(0, window.scrollY);
    });
    window.addEventListener('beforeunload', event => {
      if (!jblHasUnsavedChanges) return;
      event.preventDefault();
      event.returnValue = '';
    });

    const wrongAnswerStorageKey = 'respiratory-wrong-answers-v1';
    let wrongAnswers = readStudyStorage(wrongAnswerStorageKey, {});
    if (!wrongAnswers || typeof wrongAnswers !== 'object' || Array.isArray(wrongAnswers)) wrongAnswers = {};
    window.RespiratoryStudy = {
      navigate:quickNavigate,
      filterValues:jblFilterValues,
      wikiTools:studyWikiTools,
      toggleWiki:toggleStudyWiki,
      editWiki:editStudyWiki,
      questionTools:()=>{const viewer=studyQuestionViewer();const state=viewer&&viewerState(viewer.key);const current=viewer?.questions[state?.index];return {available:Boolean(current&&current.studyKind!=='wiki'),editing:Boolean(state?.editing)};},
      editQuestion:editStudyQuestion,
      questionFilterContext:()=>{
        const viewer=activeQuestionViewer();
        if(!viewer)return null;
        const state=viewerState(viewer.key);
        const course=lectureStudyCourseForKey(viewer.key),jbl=Boolean(course&&lectureStudyState(course).view==='jbl');
        const chapters=course ? (jbl ? lectureJblGroups(course) : lectureStudyChapters(course).filter(item=>item.numbers.length)) : [];
        return {course:Boolean(course),mode:jbl?'jbl':'j',filters:{...(state.filters||{})},randomEnabled:Boolean(state.randomEnabled||state.randomOrder?.length),
          chapter:course?(jbl?lectureStudyState(course).jblChapter||'':lectureStudyState(course).chapter):'',
          chapters:chapters.map(item=>({slug:item.slug,heading:(item.unlinked?'미연결 · ':'')+item.heading,count:item.numbers.length})),
          total:course?(jbl?chapters.length:jblQuestions.filter(question=>questionBelongsToCourse(question,course.id)).length):0};
      },
      selectQuestionChapter:slug=>{
        const viewer=activeQuestionViewer();if(!viewer?.key.startsWith('course-'))return;
        const course=lectureStudyCourseForKey(viewer.key),view=lectureStudyState(course);
        if (view.view==='jbl') view.jblChapter=lectureJblGroups(course).some(item=>item.slug===slug)?slug:'';
        else view.chapter=lectureStudyChapters(course).some(item=>item.slug===slug)?slug:'';
        const state=viewerState(viewer.key);state.index=0;clearJblRandomOrder(state);viewer.rerender();
      },
      filterQuestions:values=>{
        const viewer=activeQuestionViewer();if(!viewer)return;
        if(viewer.key==='jbl-all'){window.RespiratoryStudy.filter(values);return;}
        const state=viewerState(viewer.key);state.filters={...(state.filters||{}),...values};state.index=0;
        clearJblRandomOrder(state);viewer.rerender();
      },
      randomQuestions:()=>{
        const viewer=activeQuestionViewer();if(!viewer)return;
        if(viewer.key==='jbl-all'){window.RespiratoryStudy.random();return;}
        const state=viewerState(viewer.key);state.randomEnabled=!state.randomEnabled;state.index=0;
        state.jblRandomGroups={};
        clearJblRandomOrder(state);viewer.rerender();
      },
      context:()=>({hash:location.hash, courses:courses.map(c=>({id:c.id,title:c.title,professor:c.professor})),
        years:[...new Set(jblQuestions.map(q=>q.year))].sort((a,b)=>b-a),
        professors:[...new Set(jblQuestions.map(questionExamProfessor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')),
        filters:{...standaloneState().filters}, randomEnabled:Boolean(standaloneState().randomEnabled || standaloneState().randomOrder.length), wrongCount:wrongQuestionIds().length}),
      filter:values=>{const state=standaloneState();state.filters={...state.filters,...values};state.index=0;state.linkedQuestionNumber=null;state.wrongBatch=null;clearJblRandomOrder(state);renderJblStandalone();},
      jump:value=>{const field=document.querySelector('#jbl-jump');if(field){field.value=value;document.querySelector('[data-jbl-jump]')?.click();}},
      random:()=>{const state=standaloneState();state.randomEnabled=!(state.randomEnabled || state.randomOrder.length);state.linkedQuestionNumber=null;state.index=0;clearJblRandomOrder(state);renderJblStandalone();},
      save:saveCurrentFiles
    };
    routeFromHash();
</script>
<script src="./study-ui.js"></script>
